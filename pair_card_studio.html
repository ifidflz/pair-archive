<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair Archive — 페어 카드 스튜디오</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--accent:#f39ab5;--accent-soft:#fff0f5;--ink:#302a2d;--muted:#8f8187;--paper:#fffdfb;--line:#eee2e6}
*{box-sizing:border-box}body{margin:0;background:#fff7f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
button,input,textarea{font:inherit}.wrap{max-width:1320px;margin:auto;padding:38px 24px 70px}
.top{text-align:center;margin-bottom:30px}.top .mark{font-family:Georgia,serif;font-size:25px;color:var(--accent);margin-bottom:6px}.top h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:34px;letter-spacing:-.5px;margin:0}.top p{color:#9c8e94;margin:9px 0 0;font-size:13px}
.layout{display:grid;grid-template-columns:370px minmax(0,1fr);gap:22px;align-items:start}
.editor,.preview{background:rgba(255,253,251,.92);border:1px solid #f0dfe4;border-radius:24px;box-shadow:0 18px 45px rgba(157,83,105,.08)}
.editor{padding:24px}.preview{padding:24px;min-width:0}
.block{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.block:last-of-type{border-bottom:0;margin-bottom:0}
.block h3{font-size:14px;margin:0 0 16px;letter-spacing:.2px}.block h3 span{color:var(--accent);font-family:Georgia,serif;font-size:16px;margin-right:5px}
.field{margin-bottom:13px}.field:last-child{margin-bottom:0}label{display:block;font-size:11px;color:#8f8187;margin-bottom:6px}
input[type=text],textarea{width:100%;border:1px solid #eadde1;background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}input[type=text]:focus,textarea:focus{border-color:#ef9eb7;box-shadow:0 0 0 4px #fdebf1}textarea{min-height:76px;resize:vertical;line-height:1.6}
.upload{display:flex;align-items:center;justify-content:center;min-height:45px;border:1px dashed #e5b7c5;background:#fff8fa;border-radius:12px;color:#9a6576;cursor:pointer;font-size:13px}.upload:hover{background:#fff1f5}.upload input{display:none}
.crop{position:relative;height:220px;margin-top:10px;border-radius:14px;overflow:hidden;background:#f8edf0;touch-action:none}.crop img{position:absolute;left:50%;top:50%;max-width:none;transform:translate(-50%,-50%);user-select:none;cursor:grab}.hint{position:absolute;inset:0;display:grid;place-items:center;color:#b29ba2;font-size:12px;text-align:center;padding:30px;pointer-events:none}.frame{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 999px rgba(90,50,65,.13);border-radius:12px;pointer-events:none}
.cropTools{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px}.cropTools button{width:36px;height:32px;border:1px solid #eadde1;background:white;border-radius:9px;cursor:pointer;color:#735966}.zoom{font-size:11px;color:#8f8187;min-width:48px;text-align:center}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.sw{width:28px;height:28px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #eadde1;cursor:pointer;padding:0}.sw.active{box-shadow:0 0 0 2px #4e3a42}
.save{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#302a2d;color:white;font-weight:700;cursor:pointer;transition:all 0.2s}.save:hover{background:#4a3d42}
.previewHead{display:flex;align-items:end;justify-content:space-between;margin:0 2px 14px}.previewHead h3{font-size:14px;margin:0}.previewHead small{color:#ae9ca3;font-size:10px}
.stage{border-radius:18px;background:radial-gradient(circle at 50% 20%,#fffdfd 0,#f9eef2 58%,#f5e6eb 100%);padding:48px;min-height:730px;display:grid;place-items:center;overflow:auto}
.mac{width:min(820px,100%);aspect-ratio:1.5;background:#fff;border:1px solid #e3dfe1;border-radius:20px;overflow:hidden;box-shadow:0 30px 65px rgba(104,61,76,.19);flex:none;position:relative}
.mac:after{content:"";position:absolute;inset:44px 0 0;background:linear-gradient(120deg,transparent 45%,rgba(255,255,255,.7) 50%,transparent 55%);opacity:.4;pointer-events:none}
.macbar{height:44px;background:rgba(250,249,250,.94);border-bottom:1px solid #e7e4e5;display:flex;align-items:center;padding:0 15px;position:relative;z-index:2}.dots{display:flex;gap:7px}.dot{width:12px;height:12px;border-radius:50%}.r{background:#ff625a}.y{background:#ffc04b}.g{background:#31c85a}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;color:#999094;letter-spacing:.2px}
.card{height:calc(100% - 44px);position:relative;display:grid;grid-template-columns:260px minmax(0,1fr);gap:52px;align-items:center;padding:55px 60px}
.photo{width:260px;height:330px;border-radius:130px 130px 28px 28px;overflow:hidden;background:#f7e9ee;position:relative;box-shadow:0 14px 30px rgba(113,70,84,.14)}.photo:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.8);border-radius:inherit;pointer-events:none}.photo img{width:100%;height:100%;object-fit:cover;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.content{min-width:0}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:800;margin-bottom:16px}.name{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:42px;line-height:1.15;letter-spacing:-1px;margin:0 0 17px;word-break:break-word}.desc{font-size:14px;line-height:1.85;color:#746a70;white-space:pre-line;margin:0;max-width:410px}.rule{width:55px;height:2px;background:var(--accent);margin:27px 0}.note{font-size:12px;line-height:1.9;color:#91868b;white-space:pre-line;margin:0;max-width:420px}
@media(max-width:950px){.layout{grid-template-columns:1fr}.stage{min-height:0;padding:20px}.mac{width:800px}.preview{overflow:hidden}}
@media(max-width:560px){.wrap{padding:22px 12px 50px}.editor,.preview{padding:16px}.palette{grid-template-columns:repeat(8,1fr);gap:7px}.sw{width:25px;height:25px}.stage{padding:10px}.mac{width:720px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="mark">♡</div><h1>Pair Archive</h1><p>두 사람의 이야기를 하나의 작은 창에 담아보세요.</p></header>
<div class="layout">
<section class="editor">
<div class="block"><h3><span>01</span> 창 설정</h3>
<div class="field"><label>맥북창 제목</label><input id="winTitle" type="text" value="Pair Archive"></div>
</div>
<div class="block"><h3><span>02</span> 페어 정보</h3>
<div class="field"><label>페어 이름</label><input id="name" type="text" value="祁煜 × 我"></div>
<div class="field"><label>소개</label><textarea id="desc">심해보다 깊은 마음으로
영원히 함께할 우리의 이야기</textarea></div></div>
<div class="block"><h3><span>03</span> 사진</h3>
<label class="upload">＋ 사진 선택<input id="file" type="file" accept="image/*"></label>
<div class="crop"><img id="cropImg" hidden><span class="hint" id="hint">사진을 선택한 뒤<br>드래그해서 위치를 조절해보세요</span><span class="frame"></span></div>
<div class="cropTools"><button id="minus" type="button">−</button><span class="zoom" id="zoom">100%</span><button id="plus" type="button">＋</button><button id="reset" type="button">↺</button></div></div>
<div class="block"><h3><span>04</span> 포인트 컬러</h3><div class="palette">
<button class="sw active" data-c="#f39ab5" style="background:#f39ab5"></button><button class="sw" data-c="#f6a6c1" style="background:#f6a6c1"></button><button class="sw" data-c="#f6b7a9" style="background:#f6b7a9"></button><button class="sw" data-c="#f7cf8e" style="background:#f7cf8e"></button><button class="sw" data-c="#b9d99f" style="background:#b9d99f"></button><button class="sw" data-c="#9fd9d0" style="background:#9fd9d0"></button><button class="sw" data-c="#9fc8ee" style="background:#9fc8ee"></button><button class="sw" data-c="#c5b2e8" style="background:#c5b2e8"></button><button class="sw" data-c="#e8a9d4" style="background:#e8a9d4"></button><button class="sw" data-c="#f3b8d7" style="background:#f3b8d7"></button><button class="sw" data-c="#f1d29d" style="background:#f1d29d"></button><button class="sw" data-c="#b8dfc4" style="background:#b8dfc4"></button><button class="sw" data-c="#a9dce8" style="background:#a9dce8"></button><button class="sw" data-c="#b3c9ee" style="background:#b3c9ee"></button><button class="sw" data-c="#d4b9ee" style="background:#d4b9ee"></button><button class="sw" data-c="#f2a8a8" style="background:#f2a8a8"></button>
</div></div>
<div class="block"><h3><span>05</span> 이야기</h3>
<div class="field"><label>섹션 제목</label><input id="eyebrow" type="text" value="OUR STORY"></div>
<div class="field"><label>페어에 대한 이야기</label><textarea id="note">서로의 세계가 되어준 우리
같은 시간, 다른 공간에서도
우리는 언제나 서로를 향해 빛날 거야.</textarea></div></div>
<button class="save" id="save" type="button">PNG로 저장하기</button>
</section>
<section class="preview"><div class="previewHead"><h3>Preview</h3><small>Pair Archive · Mac Window Edition</small></div>
<div class="stage"><div class="mac" id="card"><div class="macbar"><div class="dots"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></div><span class="title" id="outTitle">Pair Archive</span></div>
<div class="card"><div class="photo"><img id="outImg" hidden></div><div class="content"><div class="eyebrow" id="outEye">OUR STORY</div><h2 class="name" id="outName">祁煜 × 我</h2><p class="desc" id="outDesc">심해보다 깊은 마음으로
영원히 함께할 우리의 이야기</p><div class="rule"></div><p class="note" id="outNote">서로의 세계가 되어준 우리
같은 시간, 다른 공간에서도
우리는 언제나 서로를 향해 빛날 거야.</p></div></div></div></div></section>
</div></div>
<script>
(()=>{const $=id=>document.getElementById(id);const s={src:null,scale:1,x:0,y:0,color:'#f39ab5'};
function sync(){
  outTitle.textContent=winTitle.value||'Pair Archive';
  outName.textContent=name.value||'Pair Name';
  outDesc.textContent=desc.value;
  outEye.textContent=eyebrow.value||'OUR STORY';
  outNote.textContent=note.value;
  document.documentElement.style.setProperty('--accent',s.color);
}
['winTitle','name','desc','eyebrow','note'].forEach(id=>$(id).addEventListener('input',sync));

function render(){
  if(!s.src)return;
  const transformStr = `translate(calc(-50% + ${s.x}px), calc(-50% + ${s.y}px)) scale(${s.scale})`;
  cropImg.style.transform = transformStr;
  outImg.style.transform = transformStr;
  zoom.textContent = Math.round(s.scale*100)+'%';
}

file.onchange=e=>{
  const f=e.target.files?.[0];
  if(!f)return;
  if(!f.type.startsWith('image/'))return alert('이미지 파일을 선택해 주세요.');
  const r=new FileReader();
  r.onload=ev=>{
    s.src=ev.target.result;
    s.scale=1;
    s.x=0;
    s.y=0;
    cropImg.src=s.src;
    cropImg.hidden=false;
    hint.hidden=true;
    outImg.src=s.src;
    outImg.hidden=false;
    render();
  };
  r.readAsDataURL(f);
};

plus.onclick=()=>{s.scale=Math.min(3,s.scale+.1);render()};
minus.onclick=()=>{s.scale=Math.max(.5,s.scale-.1);render()};
reset.onclick=()=>{s.scale=1;s.x=0;s.y=0;render()};

document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  s.color=b.dataset.c;
  document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  sync();
});

let drag=false,lx=0,ly=0;
cropImg.onpointerdown=e=>{if(!s.src)return;drag=true;lx=e.clientX;ly=e.clientY;cropImg.setPointerCapture(e.pointerId)};
cropImg.onpointermove=e=>{if(!drag)return;s.x+=e.clientX-lx;s.y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;render()};
cropImg.onpointerup=()=>drag=false;
cropImg.onpointercancel=()=>drag=false;

crop.onwheel=e=>{
  if(!s.src)return;
  e.preventDefault();
  s.scale=Math.max(.5,Math.min(3,s.scale+(e.deltaY<0?.08:-.08)));
  render();
},{passive:false};

function drawCanvasSave() {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const W = 1800, H = 1200;
  c.width = W;
  c.height = H;

  // Background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // Window Header Bar
  ctx.fillStyle = '#faf9fa';
  ctx.fillRect(0, 0, W, 92);
  ctx.fillStyle = '#e7e4e5';
  ctx.fillRect(0, 91, W, 1);

  // Dots
  ['#ff625a','#ffc04b','#31c85a'].forEach((col,i)=>{
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(38+i*42, 46, 13, 0, Math.PI*2);
    ctx.fill();
  });

  // Title
  ctx.fillStyle='#999094';
  ctx.font='17px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(winTitle.value || 'Pair Archive', W/2, 53);

  function rr(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  function lines(c,text,x,y,lh,font,fill){
    c.font=font;
    c.fillStyle=fill;
    c.textAlign='left';
    const arr = String(text||'').split('\n');
    arr.forEach((t,i)=>c.fillText(t,x,y+i*lh));
    return y+(arr.length-1)*lh;
  }

  const renderContent = () => {
    // Eyebrow
    ctx.fillStyle = s.color;
    ctx.textAlign = 'left';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText((eyebrow.value||'OUR STORY').toUpperCase(), 760, 310);

    // Name
    ctx.fillStyle = '#302a2d';
    ctx.font = '500 62px Georgia, serif';
    ctx.fillText(name.value||'Pair Name', 760, 410);

    // Description
    let y = 485;
    y = lines(ctx, desc.value, 760, y, 38, '23px sans-serif', '#746a70');

    // Accent Line
    ctx.fillStyle = s.color;
    ctx.fillRect(760, y + 35, 55, 3);

    // Note
    lines(ctx, note.value, 760, y + 100, 34, '20px sans-serif', '#91868b');

    // Export PNG
    c.toBlob(b => {
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u;
      a.download = (winTitle.value || 'pair-archive') + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }, 'image/png');
  };

  if (s.src) {
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => {
      const px = 110, py = 280, sz = 500, ph = 640;
      ctx.save();
      rr(ctx, px, py, sz, ph, 250);
      ctx.clip();

      const fit = Math.max(sz / im.width, ph / im.height);
      const iw = im.width * fit * s.scale;
      const ih = im.height * fit * s.scale;
      ctx.drawImage(im, px + (sz - iw)/2 + s.x * 2, py + (ph - ih)/2 + s.y * 2, iw, ih);
      ctx.restore();

      renderContent();
    };
    im.src = s.src;
  } else {
    // Draw empty photo placeholder
    const px = 110, py = 280, sz = 500, ph = 640;
    ctx.save();
    rr(ctx, px, py, sz, ph, 250);
    ctx.fillStyle = '#f7e9ee';
    ctx.fill();
    ctx.restore();

    renderContent();
  }
}

save.onclick = () => {
  drawCanvasSave();
};

sync();
})();
</script>
</body></html>
