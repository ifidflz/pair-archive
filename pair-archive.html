<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pair Archive — 페어 카드 스튜디오</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{
  --accent:#f39ab5;
  --accent-bg:#fff3f7;
  --accent-border:#f7dce5;
  --accent-line:#f2d5df;
  --ink:#302a2d;
  --muted:#8f8187;
}

*{ box-sizing:border-box; }

html, body{ margin:0; padding:0; width:100%; min-height:100%; }

body{
  background:#fff7f8;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}

button, input, textarea{ font:inherit; }

.wrap{ width:100%; max-width:1320px; margin:auto; padding:38px 24px 70px; }

.top{ text-align:center; margin-bottom:30px; }
.top .mark{ font-family:Georgia,serif; font-size:25px; color:var(--accent); margin-bottom:6px; }
.top h1{ font-family:Georgia,"Times New Roman",serif; font-weight:500; font-size:34px; letter-spacing:-.5px; margin:0; }
.top p{ color:#9c8e94; margin:9px 0 0; font-size:13px; }

.layout{ display:grid; grid-template-columns:370px minmax(0,1fr); gap:22px; align-items:start; }

.editor, .preview{
  background:rgba(255,253,251,.94);
  border:1px solid var(--accent-border);
  border-radius:24px;
  box-shadow:0 18px 45px rgba(157,83,105,.08);
}

.editor{ padding:24px; }
.preview{ padding:24px; min-width:0; }

.block{ padding-bottom:22px; margin-bottom:22px; border-bottom:1px solid #eee2e6; }
.block:last-of-type{ border-bottom:0; margin-bottom:0; }
.block h3{ font-size:14px; margin:0 0 16px; }
.block h3 span{ color:var(--accent); font-family:Georgia,serif; font-size:16px; margin-right:5px; }

.field{ margin-bottom:13px; }
.field:last-child{ margin-bottom:0; }

label{ display:block; font-size:11px; color:#8f8187; margin-bottom:6px; }

input[type=text], textarea{
  width:100%;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:12px;
  padding:11px 12px;
  color:var(--ink);
  outline:none;
}

input[type=text]:focus, textarea:focus{
  border-color:#ef9eb7;
  box-shadow:0 0 0 4px #fdebf1;
}

textarea{ min-height:105px; resize:vertical; line-height:1.7; }

.upload{
  display:flex; align-items:center; justify-content:center;
  min-height:45px;
  border:1px dashed #e5b7c5;
  background:#fff8fa;
  border-radius:12px;
  color:#9a6576;
  cursor:pointer;
  font-size:13px;
}
.upload:hover{ background:#fff1f5; }
.upload input{ display:none; }

.palette{ display:grid; grid-template-columns:repeat(8,1fr); gap:10px; }
.sw{
  width:28px; height:28px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #eadde1;
  cursor:pointer;
  padding:0;
}
.sw.active{ box-shadow:0 0 0 2px #4e3a42; }

.save{
  width:100%; margin-top:18px; padding:14px;
  border:0; border-radius:12px;
  background:#302a2d; color:white;
  font-weight:700; cursor:pointer;
}
.save:hover{ background:#4a3d42; }
.save:disabled{ opacity:.6; cursor:wait; }

.previewHead{ display:flex; align-items:end; justify-content:space-between; margin:0 2px 14px; }
.previewHead h3{ font-size:14px; margin:0; }
.previewHead small{ color:#ae9ca3; font-size:10px; }

.stage{
  width:100%;
  border-radius:18px;
  background:linear-gradient(135deg, var(--accent-bg), #fffafa);
  padding:30px;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  transition:background .25s ease;
}

.mac{
  position:relative;
  width:100%;
  max-width:720px;
  aspect-ratio:4 / 5;
  flex:none;
  background:var(--accent-bg);
  border:1px solid var(--accent-line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 65px rgba(104,61,76,.16);
  transition:background .25s ease, border-color .25s ease;
}

.macbar{
  position:relative;
  width:100%; height:7%; min-height:40px;
  background:rgba(255,255,255,.45);
  border-bottom:1px solid var(--accent-line);
  display:flex; align-items:center;
  padding:0 18px;
}
.dots{ display:flex; gap:7px; }
.dot{ width:12px; height:12px; border-radius:50%; }
.r{ background:#ff625a; }
.y{ background:#ffc04b; }
.g{ background:#31c85a; }

.title{
  position:absolute; left:50%;
  transform:translateX(-50%);
  max-width:60%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  color:#999094; font-size:11px;
}

.card{
  position:absolute; left:0; right:0; top:7%; bottom:0;
  width:100%;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:8% 9% 7%;
  overflow:hidden;
}

.photo{
  position:relative;
  width:82%;
  aspect-ratio:1;
  flex:none;
  border-radius:50%;
  overflow:hidden;
  background:var(--accent-bg);
  box-shadow:0 15px 32px rgba(113,70,84,.16), 0 3px 8px rgba(113,70,84,.08);
  margin-bottom:5%;
  transition:background .25s ease;
}
.photo::after{
  content:""; position:absolute; inset:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.82);
  pointer-events:none;
}
.photo img{
  display:block; width:100%; height:100%;
  object-fit:cover; border-radius:50%;
}

.content{
  width:100%; min-width:0;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  overflow:hidden;
  padding-top:1%;
}

.eyebrow{
  width:100%;
  color:var(--accent);
  font-size:11px; font-weight:800; letter-spacing:3px; line-height:1.5;
  margin-bottom:3%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.desc{
  width:100%;
  font-size:clamp(11px, 1.5vw, 14px);
  line-height:1.8;
  color:#746a70;
  white-space:pre-line;
  word-break:keep-all;
  margin:0;
  max-width:500px;
}

.note{
  width:100%;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(11px, 1.3vw, 13px);
  line-height:1.5;
  color:#91868b;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin:5% 0 0;
  max-width:500px;
}

@media(max-width:950px){
  .layout{ grid-template-columns:1fr; }
}

@media(max-width:600px){
  .wrap{ padding:20px 10px 40px; }
  .editor, .preview{ padding:16px; border-radius:20px; }
  .stage{ padding:10px; }
  .mac{ width:100%; max-width:none; }
  .palette{ gap:7px; }
  .sw{ width:25px; height:25px; }
  .card{ padding:8% 8% 7%; }
  .photo{ width:82%; }
}

@media(max-width:950px) and (orientation:landscape){
  .wrap{ padding:12px 16px 30px; }
  .top{ margin-bottom:18px; }
  .top h1{ font-size:25px; }
  .stage{ padding:10px; }
  .mac{
    width:auto;
    height:calc(100vh - 180px);
    max-width:none;
    aspect-ratio:4 / 5;
  }
}

.capture-mode .mac{
  box-shadow:0 30px 65px rgba(104,61,76,.16);
}

</style>
</head>
