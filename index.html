<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pair Archive — 페어 카드 스튜디오</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{
  --accent:#f39ab5;

  /* 선택한 포인트 컬러 기반의 연한 배경 */
  --accent-bg:#fff0f5;
  --accent-bg-strong:#fce3eb;

  --ink:#302a2d;
  --muted:#8f8187;
  --paper:#fffdfb;
}


/* =========================
   기본
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans KR",
  "Apple SD Gothic Neo",
  sans-serif;
}

button,
input,
textarea{
  font:inherit;
}


/* =========================
   전체 레이아웃
========================= */

.wrap{
  width:100%;
  max-width:1320px;
  margin:auto;
  padding:38px 24px 70px;
}

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
  margin-bottom:6px;
}

.top h1{
  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-weight:500;

  font-size:34px;

  letter-spacing:-.5px;

  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}

.layout{
  display:grid;

  grid-template-columns:
  370px
  minmax(0,1fr);

  gap:22px;

  align-items:start;
}


/* =========================
   카드 박스
========================= */

.editor,
.preview{
  background:
  rgba(255,253,251,.94);

  border:
  1px solid
  #f0dfe4;

  border-radius:24px;

  box-shadow:
  0 18px 45px
  rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}


/* =========================
   편집 블록
========================= */

.block{
  padding-bottom:22px;

  margin-bottom:22px;

  border-bottom:
  1px solid
  #eee2e6;
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;

  margin:
  0 0 16px;
}

.block h3 span{
  color:var(--accent);

  font-family:
  Georgia,
  serif;

  font-size:16px;

  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;

  font-size:11px;

  color:#8f8187;

  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;

  border:
  1px solid
  #eadde1;

  background:#fff;

  border-radius:12px;

  padding:
  11px 12px;

  color:var(--ink);

  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;

  box-shadow:
  0 0 0 4px
  #fdebf1;
}

textarea{
  min-height:100px;

  resize:vertical;

  line-height:1.7;
}


/* =========================
   사진 업로드
========================= */

.upload{
  display:flex;

  align-items:center;

  justify-content:center;

  min-height:45px;

  border:
  1px dashed
  #e5b7c5;

  background:
  #fff8fa;

  border-radius:12px;

  color:#9a6576;

  cursor:pointer;

  font-size:13px;
}

.upload:hover{
  background:#fff1f5;
}

.upload input{
  display:none;
}


/* =========================
   사진 조절창
========================= */

.crop{
  position:relative;

  width:100%;

  aspect-ratio:1;

  margin-top:14px;

  border-radius:50%;

  overflow:hidden;

  background:
  var(--accent-bg-strong);

  touch-action:none;

  box-shadow:
  inset 0 0 0 2px
  rgba(255,255,255,.9),

  0 12px 28px
  rgba(113,70,84,.12);
}

.crop img{
  position:absolute;

  left:50%;
  top:50%;

  max-width:none;

  transform-origin:center center;

  cursor:grab;

  user-select:none;
}

.crop img:active{
  cursor:grabbing;
}

.hint{
  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  text-align:center;

  color:#b29ba2;

  font-size:12px;

  line-height:1.7;

  pointer-events:none;
}

.cropTools{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

  margin-top:12px;
}

.cropTools button{
  width:36px;
  height:32px;

  border:
  1px solid
  #eadde1;

  background:white;

  border-radius:9px;

  cursor:pointer;

  color:#735966;
}

.zoom{
  font-size:11px;

  color:#8f8187;

  min-width:48px;

  text-align:center;
}


/* =========================
   컬러 팔레트
========================= */

.palette{
  display:grid;

  grid-template-columns:
  repeat(8,1fr);

  gap:10px;
}

.sw{
  width:28px;
  height:28px;

  border-radius:50%;

  border:
  3px solid
  white;

  box-shadow:
  0 0 0 1px
  #eadde1;

  cursor:pointer;

  padding:0;
}

.sw.active{
  box-shadow:
  0 0 0 2px
  #4e3a42;
}


/* =========================
   저장 버튼
========================= */

.save{
  width:100%;

  margin-top:18px;

  padding:14px;

  border:0;

  border-radius:12px;

  background:#302a2d;

  color:white;

  font-weight:700;

  cursor:pointer;

  transition:
  opacity .2s,
  transform .2s;
}

.save:hover{
  background:#4a3d42;
}

.save:active{
  transform:scale(.99);
}

.save:disabled{
  opacity:.6;

  cursor:wait;
}


/* =========================
   미리보기 헤더
========================= */

.previewHead{
  display:flex;

  align-items:end;

  justify-content:space-between;

  margin:
  0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}


/* =========================
   미리보기 배경
========================= */

.stage{
  width:100%;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    var(--accent-bg),
    #fffafa
  );

  padding:30px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  transition:
  background .25s ease;
}


/* =========================
   실제 결과물
   4:5
========================= */

.mac{
  position:relative;

  width:100%;

  max-width:720px;

  aspect-ratio:
  4 / 5;

  flex:none;

  background:
  var(--accent-bg);

  border:
  1px solid
  rgba(255,255,255,.9);

  border-radius:20px;

  overflow:hidden;

  box-shadow:
  0 30px 65px
  rgba(104,61,76,.19);

  transition:
  background .25s ease;
}


/* =========================
   맥북 상단 바
========================= */

.macbar{
  position:relative;

  width:100%;

  height:7%;

  min-height:40px;

  background:
  rgba(255,255,255,.72);

  border-bottom:
  1px solid
  rgba(150,110,125,.12);

  display:flex;

  align-items:center;

  padding:
  0 18px;

  backdrop-filter:
  blur(10px);
}

.dots{
  display:flex;

  gap:7px;
}

.dot{
  width:12px;
  height:12px;

  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}

.title{
  position:absolute;

  left:50%;

  transform:
  translateX(-50%);

  max-width:55%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  color:#8d8186;

  font-size:11px;
}


/* =========================
   카드 본문

   사진과 글 사이를
   넉넉하게 유지

   위/아래 여백 균형
========================= */

.card{
  position:absolute;

  left:0;
  right:0;

  top:7%;
  bottom:0;

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  /*
    위쪽 여백
    아래쪽 여백
    좌우 여백
  */

  padding:
  7% 8% 7%;

  overflow:hidden;
}


/* =========================
   사진

   가로 80%

   은은한 그림자
========================= */

.photo{
  position:relative;

  width:80%;

  aspect-ratio:1;

  flex:none;

  border-radius:50%;

  overflow:hidden;

  background:
  var(--accent-bg-strong);

  /*
    사진 아래 여백 확대
  */

  margin-bottom:
  7%;

  box-shadow:
  0 12px 30px
  rgba(104,61,76,.12),

  0 4px 10px
  rgba(104,61,76,.06);

  transition:
  background .25s ease,
  box-shadow .25s ease;
}

.photo::after{
  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:
  2px solid
  rgba(255,255,255,.82);

  pointer-events:none;
}

.photo img{
  position:absolute;

  left:50%;
  top:50%;

  max-width:none;

  transform-origin:center center;
}


/* =========================
   텍스트 영역
========================= */

.content{
  width:100%;

  min-width:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  overflow:hidden;

  flex:1;

  /*
    콘텐츠가 아래에
    너무 붙지 않도록
    여유 확보
  */

  padding-bottom:
  2%;
}


/*
  페어명

  기존 큰 페어 이름 대신
  작은 제목으로 사용
*/

.eyebrow{
  width:100%;

  color:
  var(--accent);

  font-size:10px;

  font-weight:800;

  letter-spacing:3px;

  margin-bottom:4%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/*
  큰 페어 이름 삭제

  기존 .name 대신
  사용하지 않음
*/


.desc{
  width:100%;

  font-size:
  clamp(
    10px,
    1.5vw,
    14px
  );

  line-height:1.8;

  color:#746a70;

  white-space:pre-line;

  word-break:keep-all;

  margin:0;

  max-width:560px;
}


/*
  포인트 컬러 하단 바 삭제

  기존 .rule을 아예 표시하지 않음
*/

.rule{
  display:none;
}


.note{
  width:100%;

  font-size:
  clamp(
    9px,
    1.3vw,
    12px
  );

  line-height:1.85;

  color:#91868b;

  white-space:pre-line;

  word-break:keep-all;

  margin:
  6% 0 0;

  max-width:560px;
}


/* =========================
   모바일
========================= */

@media(max-width:950px){

  .layout{
    grid-template-columns:
    1fr;
  }

}


/* =========================
   모바일 세로
========================= */

@media(max-width:600px){

  .wrap{
    padding:
    20px 10px 40px;
  }

  .editor,
  .preview{
    padding:16px;

    border-radius:20px;
  }

  .stage{
    padding:10px;
  }

  .mac{
    width:100%;
    max-width:none;
  }

  .palette{
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

  .card{
    padding:
    7% 7% 7%;
  }

}


/* =========================
   모바일 가로
========================= */

@media(
  max-width:950px
) and (
  orientation:landscape
){

  .wrap{
    padding:
    12px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top h1{
    font-size:25px;
  }

  .stage{
    padding:10px;
  }

  .mac{
    width:auto;

    height:
    calc(100vh - 180px);

    max-width:none;

    aspect-ratio:
    4 / 5;
  }

}


/* =========================
   캡처 시
   미리보기와 완전히 동일한
   화면을 유지
========================= */

.capture-mode .mac{
  box-shadow:
  0 30px 65px
  rgba(104,61,76,.19);
}

(() => {


/* =========================

========================= */

const state = {

  src:null,

  x:0,

  y:0,

  scale:1,

  color:'#f39ab5'

};



/* =========================
   DOM
========================= */

const $ =
id =>
document.getElementById(id);


const windowTitle =
$('windowTitle');

const desc =
$('desc');

const eyebrow =

const note =

const crop =
$('crop');

const cropImg =
$('cropImg');

const hint =
$('hint');

$('photo');

$('outImg');

$('outTitle');

$('outDesc');

$('outEye');

$('outNote');

$('zoom');

const save =
$('save');

const mac =
$('mac');



/* =========================
   색상 밝기 계산
========================= */

function hexToRgb(hex){

  hex =
  hex.replace('#','');

  return {

    r:
    parseInt(
      hex.substring(0,2),
      16
    ),

    g:
    parseInt(
      hex.substring(2,4),
      16
    ),

    b:
    parseInt(
      hex.substring(4,6),
      16
    )

  };

}


/*
  선택한 색을
  흰색과 섞어서
  연한 파스텔 배경 생성
*/

function makePastel(
  hex,
  amount=.88
){

  const rgb =
  hexToRgb(hex);


  const r =
  Math.round(
    rgb.r +
    (255-rgb.r) *
    amount
  );


  const g =
  Math.round(
    rgb.g +
    (255-rgb.g) *
    amount
  );


  const b =
  Math.round(
    rgb.b +
    (255-rgb.b) *
    amount
  );


  return `
    rgb(
      ${r},
      ${g},
      ${b}
    )
  `;

}


/* =========================
   텍스트 동기화
========================= */

function syncText(){

  outTitle.textContent =

    windowTitle.value ||
    'Pair Archive';


  outDesc.textContent =

    desc.value;


  outEye.textContent =

    eyebrow.value ||
    'PAIR';


  outNote.textContent =

    note.value;

}


/* =========================
   컬러 적용
========================= */

function applyColor(){

  const color =
    state.color;


  const light =
    makePastel(
      color,
      .91
    );


  const stronger =
    makePastel(
      color,
      .84
    );


  document.documentElement
  .style
  .setProperty(
    '--accent',
    color
  );


  document.documentElement
  .style
  .setProperty(
    '--accent-bg',
    light
  );


  document.documentElement
  .style
  .setProperty(
    '--accent-bg-strong',
    stronger
  );

}


/* =========================
   사진 렌더링
========================= */

function renderPhoto(){

  if(
    !state.src ||
    !cropImg.naturalWidth
  ){

    return;

  }


  const cropSize =
    crop.clientWidth;


  const photoSize =
    photo.clientWidth;


  /*
    조절창
    이미지가 원을 꽉 채우도록 계산
  */

  const cropBase =

    Math.max(

      cropSize /
      cropImg.naturalWidth,

      cropSize /
      cropImg.naturalHeight

    );


  const cropWidth =

    cropImg.naturalWidth *
    cropBase *
    state.scale;


  const cropHeight =

    cropImg.naturalHeight *
    cropBase *
    state.scale;


  cropImg.style.width =
    cropWidth + 'px';


  cropImg.style.height =
    cropHeight + 'px';


  cropImg.style.transform =

    `translate(
      calc(-50% + ${state.x}px),
      calc(-50% + ${state.y}px)
    )`;


  /*
    조절창 → 미리보기
    비율을 정확히 맞춤
  */

  const ratio =

    photoSize /
    cropSize;


  const previewBase =

    Math.max(

      photoSize /
      cropImg.naturalWidth,

      photoSize /
      cropImg.naturalHeight

    );


  const previewWidth =

    cropImg.naturalWidth *
    previewBase *
    state.scale;


  const previewHeight =

    cropImg.naturalHeight *
    previewBase *
    state.scale;


  outImg.style.width =

    previewWidth + 'px';


  outImg.style.height =

    previewHeight + 'px';


  outImg.style.transform =

    `translate(
      calc(-50% + ${state.x * ratio}px),
      calc(-50% + ${state.y * ratio}px)
    )`;


  zoom.textContent =

    Math.round(
      state.scale *
      100
    ) + '%';

}


/* =========================
   사진 업로드
========================= */

file.addEventListener(

  'change',

  event => {

    const f =
      event.target.files?.[0];


    if(!f){
      return;
    }


    if(
      !f.type.startsWith(
        'image/'
      )
    ){

      alert(
        '이미지 파일을 선택해 주세요.'
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =

    event => {

      state.src =
        event.target.result;

      state.x =
        0;

      state.y =
        0;

      state.scale =
        1;


      cropImg.onload = () => {

        cropImg.hidden =
          false;

        outImg.src =
          state.src;

        outImg.hidden =
          false;

        hint.hidden =
          true;


        requestAnimationFrame(

          renderPhoto

        );

      };


      cropImg.src =
        state.src;

    };


    reader.readAsDataURL(f);

  }

);


/* =========================
   확대
========================= */

$('plus').onclick = () => {

  if(!state.src){
    return;
  }


  state.scale =

    Math.min(

      3,

      state.scale + .1

    );


  renderPhoto();

};


/* =========================
   축소
========================= */

$('minus').onclick = () => {

  if(!state.src){
    return;
  }


  state.scale =

    Math.max(

      .5,

      state.scale - .1

    );


  renderPhoto();

};


/* =========================
   초기화
========================= */

$('reset').onclick = () => {

  state.x =
    0;

  state.y =
    0;

  state.scale =
    1;

  renderPhoto();

};


/* =========================
   마우스 휠 확대
========================= */

crop.addEventListener(

  'wheel',

  event => {

    if(!state.src){
      return;
    }


    event.preventDefault();


    state.scale =

      Math.max(

        .5,

        Math.min(

          3,

          state.scale +

          (
            event.deltaY < 0
            ? .08
            : -.08
          )

        )

      );


    renderPhoto();

  },

  {
    passive:false
  }

);


/* =========================
   드래그
========================= */

let dragging =
false;

let lastX =
0;

let lastY =
0;


cropImg.addEventListener(

  'pointerdown',

  event => {

    if(!state.src){
      return;
    }


    dragging =
      true;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    cropImg.setPointerCapture(

      event.pointerId

    );

  }

);


cropImg.addEventListener(

  'pointermove',

  event => {

    if(!dragging){
      return;
    }


    state.x +=

      event.clientX -
      lastX;


    state.y +=

      event.clientY -
      lastY;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    renderPhoto();

  }

);


function stopDrag(){

  dragging =
    false;

}


cropImg.addEventListener(
  'pointerup',
  stopDrag
);

cropImg.addEventListener(
  'pointercancel',
  stopDrag
);


/* =========================
   컬러 선택
========================= */

document
.querySelectorAll('.sw')
.forEach(

  button => {

    button.onclick = () => {

      state.color =

        button.dataset.c;


      document
      .querySelectorAll('.sw')
      .forEach(

        x =>

        x.classList.remove(
          'active'
        )

      );


      button.classList.add(
        'active'
      );


      applyColor();

    };

  }

);


/* =========================
   텍스트 입력
========================= */

[
  windowTitle,
  desc,
  eyebrow,
  note

].forEach(

  element => {

    element.addEventListener(

      'input',

      syncText

    );

  }

);


/* =========================
   화면 크기 변경
========================= */

window.addEventListener(

  'resize',

  () => {

    if(state.src){

      requestAnimationFrame(

        renderPhoto

      );

    }

  }

);


/* =========================
   이미지 저장
========================= */

save.addEventListener(

  'click',

  async () => {


    if(!state.src){

      alert(
        '먼저 사진을 선택해 주세요.'
      );

      return;

    }


    if(
      typeof html2canvas ===
      'undefined'
    ){

      alert(
        '이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'
      );

      return;

    }


    save.disabled =
      true;

    save.textContent =
      '이미지 생성 중...';


    try{


      /*
        저장 직전에
        최신 상태 반영
      */

      syncText();

      applyColor();

      renderPhoto();


      /*
        브라우저 렌더링 완료 대기
      */

      await new Promise(

        resolve =>

          requestAnimationFrame(

            () =>

            requestAnimationFrame(

              resolve

            )

          )

      );


      /*
        미리보기 DOM 자체 캡처

        CSS 결과와 저장 결과 동일
      */

      const canvas =

        await html2canvas(

          mac,

          {

            scale:3,

            useCORS:true,

            allowTaint:false,

            backgroundColor:
            null,

            logging:false,

            imageTimeout:
            15000

          }

        );


      const blob =

        await new Promise(

          resolve =>

            canvas.toBlob(

              resolve,

              'image/png',

              1

            )

        );


      if(!blob){

        throw new Error(
          'PNG 생성 실패'
        );

      }


      const url =

        URL.createObjectURL(
          blob
        );


      const link =

        document.createElement(
          'a'
        );


      link.href =
        url;


      link.download =
        'pair-archive.png';


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(

        () => {

          URL.revokeObjectURL(
            url
          );

        },

        1500

      );


    }catch(error){

      console.error(
        error
      );


      alert(
        '이미지를 저장하는 중 문제가 발생했습니다.\n잠시 후 다시 시도해 주세요.'
      );


    }finally{

      save.disabled =
        false;

      save.textContent =
        '이미지로 저장';

    }

  }

);


/* =========================
   초기 실행
========================= */

syncText();

applyColor();


})();

</script>
