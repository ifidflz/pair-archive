<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pair Archive — 페어 카드 스튜디오</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{
  --accent:#f39ab5;
  --accent-soft:#fff1f5;
  --accent-bg:#fffafb;
  --ink:#302a2d;
  --muted:#8f8187;
  --line:#eadde1;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans KR",
  "Apple SD Gothic Neo",
  sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

.wrap{
  width:100%;
  max-width:1320px;
  margin:auto;
  padding:38px 24px 70px;
}


/* =========================
   상단
========================= */

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
  margin-bottom:6px;
}

.top h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:34px;
  letter-spacing:-.5px;
  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}


/* =========================
   레이아웃
========================= */

.layout{
  display:grid;
  grid-template-columns:370px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.editor,
.preview{
  background:#fffdfb;
  border:1px solid #f0dfe4;
  border-radius:24px;
  box-shadow:
  0 18px 45px rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}


/* =========================
   입력 블록
========================= */

.block{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid #eee2e6;
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;
  margin:0 0 16px;
}

.block h3 span{
  color:var(--accent);
  font-family:Georgia,serif;
  font-size:16px;
  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:11px;
  color:#8f8187;
  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:12px;
  padding:11px 12px;
  color:var(--ink);
  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;
  box-shadow:
  0 0 0 4px #fdebf1;
}

textarea{
  min-height:100px;
  resize:vertical;
  line-height:1.7;
}


/* =========================
   사진 업로드
========================= */

.upload{
  display:flex;
  align-items:center;
  justify-content:center;

  min-height:45px;

  border:1px dashed #e5b7c5;

  background:#fff8fa;

  border-radius:12px;

  color:#9a6576;

  cursor:pointer;

  font-size:13px;
}

.upload:hover{
  background:#fff1f5;
}

.upload input{
  display:none;
}


/* =========================
   색상 팔레트
========================= */

.palette{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.sw{
  width:28px;
  height:28px;

  border-radius:50%;

  border:3px solid white;

  box-shadow:
  0 0 0 1px #eadde1;

  cursor:pointer;

  padding:0;
}

.sw.active{
  box-shadow:
  0 0 0 2px #4e3a42;
}


/* =========================
   저장 버튼
========================= */

.save{
  width:100%;

  margin-top:18px;

  padding:14px;

  border:0;

  border-radius:12px;

  background:#302a2d;

  color:white;

  font-weight:700;

  cursor:pointer;
}

.save:hover{
  background:#4a3d42;
}

.save:disabled{
  opacity:.6;
  cursor:wait;
}


/* =========================
   미리보기 헤더
========================= */

.previewHead{
  display:flex;
  align-items:end;
  justify-content:space-between;

  margin:
  0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}


/* =========================
   미리보기 바깥 배경
========================= */

.stage{
  width:100%;

  border-radius:18px;

  background:
  linear-gradient(
    145deg,
    var(--accent-bg),
    var(--accent-soft)
  );

  padding:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  transition:
  background .3s ease;
}


/* ==================================================
   실제 결과물
   4:5 고정
================================================== */

.mac{
  position:relative;

  width:100%;

  max-width:720px;

  aspect-ratio:4 / 5;

  flex:none;

  background:
  var(--accent-bg);

  border:
  1px solid var(--accent);

  border-radius:20px;

  overflow:hidden;

  box-shadow:
  0 30px 65px
  rgba(104,61,76,.19);

  transition:
  background .3s ease,
  border-color .3s ease;
}


/* =========================
   맥북 상단바
========================= */

.macbar{
  position:relative;

  width:100%;

  height:7%;

  min-height:40px;

  background:
  var(--accent-soft);

  border-bottom:
  1px solid var(--accent);

  display:flex;

  align-items:center;

  padding:
  0 18px;

  transition:
  background .3s ease,
  border-color .3s ease;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}


/* 페어명 */

.title{
  position:absolute;

  left:50%;

  top:50%;

  transform:
  translate(-50%,-50%);

  width:60%;

  text-align:center;

  color:
  #786a70;

  font-size:12px;

  font-weight:500;

  letter-spacing:.2px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================
   카드 본문

   위 여백 =
   아래 여백

   사진과 글 사이도 충분히 확보
========================= */

.card{
  position:absolute;

  left:0;
  right:0;

  top:7%;
  bottom:0;

  width:100%;
  height:93%;

  display:grid;

  grid-template-rows:
  1fr
  auto
  1fr;

  align-items:center;

  justify-items:center;

  padding:
  7% 8%;

  text-align:center;

  overflow:hidden;
}


/* =========================
   사진

   1:1
   둥근 사각형
========================= */

.photo{
  position:relative;

  width:84%;

  aspect-ratio:1 / 1;

  border-radius:28px;

  overflow:hidden;

  background:
  var(--accent-soft);

  box-shadow:
  0 18px 38px
  rgba(113,70,84,.18),

  0 4px 12px
  rgba(113,70,84,.08);

  grid-row:1;

  align-self:center;

  transition:
  background .3s ease;
}

.photo::after{
  content:"";

  position:absolute;

  inset:0;

  border-radius:28px;

  border:
  1px solid
  rgba(255,255,255,.9);

  pointer-events:none;
}

.photo img{
  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;
}


/* =========================
   글 콘텐츠

   사진과 확실하게 분리
========================= */

.content{
  width:100%;

  min-width:0;

  grid-row:2;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:
  6% 0 5%;

  overflow:hidden;
}


/* 페어명 */

.eyebrow{
  width:100%;

  color:
  var(--accent);

  font-size:11px;

  font-weight:800;

  letter-spacing:2.5px;

  line-height:1.4;

  margin:0;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  transition:
  color .3s ease;
}


/* 설명 */

.desc{
  width:100%;

  font-size:
  clamp(
    11px,
    1.5vw,
    14px
  );

  line-height:1.8;

  color:#746a70;

  white-space:pre-line;

  word-break:keep-all;

  margin:
  8px 0 0;
}


/* 마지막 한 줄 문구 */

.note{
  width:100%;

  font-size:
  clamp(
    9px,
    1.25vw,
    12px
  );

  line-height:1.6;

  color:#91868b;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  margin:0;

  grid-row:3;

  align-self:center;

  padding-top:0;
}


/* =========================
   캡처 시 그림자 제거
   외곽 테두리는 유지
========================= */

.capture-mode .mac{
  box-shadow:none;
}


/* =========================
   태블릿
========================= */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

}


/* =========================
   모바일 세로
========================= */

@media(max-width:600px){

  .wrap{
    padding:
    20px 10px 40px;
  }

  .editor,
  .preview{
    padding:16px;
    border-radius:20px;
  }

  .stage{
    padding:10px;
  }

  .mac{
    width:100%;
    max-width:none;
  }

  .palette{
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

  .card{
    padding:
    7% 7%;
  }

  .photo{
    width:86%;
    border-radius:22px;
  }

  .photo::after{
    border-radius:22px;
  }

}


/* =========================
   모바일 가로
========================= */

@media(
  max-width:950px
) and (
  orientation:landscape
){

  .wrap{
    padding:
    12px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top h1{
    font-size:25px;
  }

  .stage{
    padding:10px;
  }

  .mac{
    width:auto;

    height:
    calc(100vh - 180px);

    max-width:none;

    aspect-ratio:
    4 / 5;
  }

}

</style>
</head>


<body>


<div class="wrap">

<div class="layout">


<!-- =========================

========================= -->

<section class="editor">


<!-- 페어 정보 -->

<div class="block">

<div class="field">

같은 시간, 다른 공간에서도

>

<script>

(() => {


/* =========================
   상태
========================= */

const state = {

  src:null,

  color:'#f39ab5'

};



/* =========================
   DOM
========================= */

const $ =
id =>
document.getElementById(id);


const windowTitle =
$('windowTitle');

const desc =
$('desc');

const desc2 =
$('desc2');

const eyebrow =
$('eyebrow');

const note =
$('note');

const file =
$('file');

const outTitle =
$('outTitle');

const outImg =
$('outImg');

const outDesc =
$('outDesc');

const outEye =
$('outEye');

const outNote =
$('outNote');

const save =
$('save');

const mac =
$('mac');

const stage =
document.querySelector('.stage');



/* =========================
   색상 밝기 계산
========================= */

function hexToRgb(hex){

  hex =
  hex.replace('#','');

  return {

    r:
    parseInt(
      hex.substring(0,2),
      16
    ),

    g:
    parseInt(
      hex.substring(2,4),
      16
    ),

    b:
    parseInt(
      hex.substring(4,6),
      16
    )

  };

}


function mixWithWhite(
  hex,
  amount
){

  const rgb =
  hexToRgb(hex);


  const r =
  Math.round(
    rgb.r +
    (255-rgb.r) *
    amount
  );


  const g =
  Math.round(
    rgb.g +
    (255-rgb.g) *
    amount
  );


  const b =
  Math.round(
    rgb.b +
    (255-rgb.b) *
    amount
  );


  return `rgb(${r},${g},${b})`;

}



/* =========================
   텍스트 동기화
========================= */

function syncText(){


  outTitle.textContent =

    windowTitle.value ||

    'Pair Archive';


  outDesc.textContent =

    desc.value;


  outEye.textContent =

    eyebrow.value ||

    'OUR STORY';


  outNote.textContent =

    note.value ||

    'with love, always.';


}



/* =========================
   색상 적용
========================= */

function applyColor(){


  const soft =
  mixWithWhite(
    state.color,
    .88
  );


  const bg =
  mixWithWhite(
    state.color,
    .95
  );


  document.documentElement
  .style
  .setProperty(
    '--accent',
    state.color
  );


  document.documentElement
  .style
  .setProperty(
    '--accent-soft',
    soft
  );


  document.documentElement
  .style
  .setProperty(
    '--accent-bg',
    bg
  );

}



/* =========================
   사진 업로드

   자동 1:1
   object-fit:cover
========================= */

file.addEventListener(

  'change',

  event => {


    const f =
    event.target.files?.[0];


    if(!f){

      return;

    }


    if(
      !f.type.startsWith(
        'image/'
      )
    ){

      alert(
        '이미지 파일을 선택해 주세요.'
      );

      return;

    }


    const reader =
    new FileReader();


    reader.onload =

    event => {


      state.src =
      event.target.result;


      outImg.onload =

      () => {

        outImg.hidden =
        false;

      };


      outImg.src =
      state.src;


    };


    reader.readAsDataURL(
      f
    );


  }

);



/* =========================
   텍스트 입력
========================= */

[
  windowTitle,
  desc,
  desc2,
  eyebrow,
  note

].forEach(

  element => {


    element.addEventListener(

      'input',

      () => {


        /*
          소개 textarea
        */

        if(
          element === desc
        ){

          outDesc.textContent =
          desc.value;

        }


        /*
          페어 이야기
        */

        if(
          element === desc2
        ){

          outDesc.textContent =
          desc2.value;

        }


        /*
          나머지
        */

        syncText();


      }

    );


  }

);



/* =========================
   색상 선택
========================= */

document
.querySelectorAll('.sw')
.forEach(

  button => {


    button.onclick =

    () => {


      state.color =
      button.dataset.c;


      document
      .querySelectorAll('.sw')
      .forEach(

        item =>

        item.classList.remove(
          'active'
        )

      );


      button.classList.add(
        'active'
      );


      applyColor();


    };


  }

);



/* =========================
   이미지 저장

   #mac 전체를 그대로 캡처

   미리보기와 PNG 동일
========================= */

save.addEventListener(

  'click',

  async () => {


    if(!state.src){

      alert(
        '먼저 사진을 선택해 주세요.'
      );

      return;

    }


    if(
      typeof html2canvas ===
      'undefined'
    ){

      alert(
        '이미지 저장 기능을 불러오지 못했습니다.'
      );

      return;

    }


    save.disabled =
    true;


    save.textContent =
    '이미지 생성 중...';


    try{


      /*
        이미지 로딩 대기
      */

      if(
        !outImg.complete
      ){

        await new Promise(

          resolve => {

            outImg.onload =
            resolve;

          }

        );

      }


      /*
        마지막 화면 렌더링 대기
      */

      await new Promise(

        resolve =>

        requestAnimationFrame(

          () =>

          requestAnimationFrame(
            resolve
          )

        )

      );


      /*
        미리보기 맥북창 자체 캡처
      */

      const canvas =

      await html2canvas(

        mac,

        {

          scale:3,

          useCORS:true,

          allowTaint:false,

          backgroundColor:
          getComputedStyle(
            mac
          ).backgroundColor,

          logging:false,

          imageTimeout:15000

        }

      );


      /*
        PNG
      */

      const blob =

      await new Promise(

        resolve =>

        canvas.toBlob(

          resolve,

          'image/png',

          1

        )

      );


      if(!blob){

        throw new Error(
          'PNG 생성 실패'
        );

      }


      const url =

      URL.createObjectURL(
        blob
      );


      const link =

      document.createElement(
        'a'
      );


      link.href =
      url;


      link.download =
      'pair-archive.png';


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(

        () => {

          URL.revokeObjectURL(
            url
          );

        },

        1500

      );


    }catch(error){


      console.error(
        error
      );


      alert(
        '이미지를 저장하는 중 문제가 발생했습니다.\n잠시 후 다시 시도해 주세요.'
      );


    }finally{


      save.disabled =
      false;


      save.textContent =
      '이미지로 저장';


    }


  }

);



/* =========================
   초기 실행
========================= */

applyColor();

syncText();


})();

</script>

</body>
</html>
