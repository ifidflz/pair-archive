<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pair Archive — 페어 카드 스튜디오</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =========================================================
   기본
========================================================= */

:root{
  --accent:#f39ab5;

  /* 선택한 포인트 컬러를 바탕으로 자동 생성되는 색 */
  --accent-bg:#fff3f7;
  --accent-border:#f7dce5;
  --accent-line:#f2d5df;

  --ink:#302a2d;
  --muted:#8f8187;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans KR",
  "Apple SD Gothic Neo",
  sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

.wrap{
  width:100%;
  max-width:1320px;
  margin:auto;
  padding:38px 24px 70px;
}


/* =========================================================
   상단
========================================================= */

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
  margin-bottom:6px;
}

.top h1{
  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-weight:500;
  font-size:34px;

  letter-spacing:-.5px;

  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}


/* =========================================================
   레이아웃
========================================================= */

.layout{
  display:grid;

  grid-template-columns:
  370px
  minmax(0,1fr);

  gap:22px;

  align-items:start;
}

.editor,
.preview{
  background:
  rgba(255,253,251,.94);

  border:
  1px solid
  var(--accent-border);

  border-radius:24px;

  box-shadow:
  0 18px 45px
  rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}


/* =========================================================
   편집 블록
========================================================= */

.block{
  padding-bottom:22px;
  margin-bottom:22px;

  border-bottom:
  1px solid
  #eee2e6;
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;
  margin:0 0 16px;
}

.block h3 span{
  color:var(--accent);

  font-family:Georgia,serif;

  font-size:16px;

  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;

  font-size:11px;

  color:#8f8187;

  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;

  border:
  1px solid
  #eadde1;

  background:#fff;

  border-radius:12px;

  padding:11px 12px;

  color:var(--ink);

  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;

  box-shadow:
  0 0 0 4px
  #fdebf1;
}

textarea{
  min-height:105px;

  resize:vertical;

  line-height:1.7;
}


/* =========================================================
   사진 업로드
========================================================= */

.upload{
  display:flex;

  align-items:center;
  justify-content:center;

  min-height:45px;

  border:
  1px dashed
  #e5b7c5;

  background:#fff8fa;

  border-radius:12px;

  color:#9a6576;

  cursor:pointer;

  font-size:13px;
}

.upload:hover{
  background:#fff1f5;
}

.upload input{
  display:none;
}


/* =========================================================
   색상 팔레트
========================================================= */

.palette{
  display:grid;

  grid-template-columns:
  repeat(8,1fr);

  gap:10px;
}

.sw{
  width:28px;
  height:28px;

  border-radius:50%;

  border:
  3px solid
  white;

  box-shadow:
  0 0 0 1px
  #eadde1;

  cursor:pointer;

  padding:0;
}

.sw.active{
  box-shadow:
  0 0 0 2px
  #4e3a42;
}


/* =========================================================
   저장 버튼
========================================================= */

.save{
  width:100%;

  margin-top:18px;

  padding:14px;

  border:0;

  border-radius:12px;

  background:#302a2d;

  color:white;

  font-weight:700;

  cursor:pointer;
}

.save:hover{
  background:#4a3d42;
}

.save:disabled{
  opacity:.6;
  cursor:wait;
}


/* =========================================================
   미리보기 헤더
========================================================= */

.previewHead{
  display:flex;

  align-items:end;
  justify-content:space-between;

  margin:
  0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}


/* =========================================================
   미리보기 영역
========================================================= */

.stage{
  width:100%;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    var(--accent-bg),
    #fffafa
  );

  padding:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  transition:
  background .25s ease;
}


/* =========================================================
   실제 결과물
   4:5 고정

   이 #mac 자체를 PNG로 저장함
========================================================= */

.mac{
  position:relative;

  width:100%;

  max-width:720px;

  aspect-ratio:
  4 / 5;

  flex:none;

  background:
  var(--accent-bg);

  border:
  1px solid
  var(--accent-line);

  border-radius:20px;

  overflow:hidden;

  box-shadow:
  0 30px 65px
  rgba(104,61,76,.16);

  transition:
  background .25s ease,
  border-color .25s ease;
}


/* =========================================================
   맥북 상단 바
========================================================= */

.macbar{
  position:relative;

  width:100%;

  height:7%;

  min-height:40px;

  background:
  rgba(255,255,255,.45);

  border-bottom:
  1px solid
  var(--accent-line);

  display:flex;

  align-items:center;

  padding:
  0 18px;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:12px;
  height:12px;

  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}


/* 맥북 창 이름 */

.title{
  position:absolute;

  left:50%;

  transform:
  translateX(-50%);

  max-width:60%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  color:#999094;

  font-size:11px;
}


/* =========================================================
   카드 내부

   위 여백을 넉넉하게 확보
========================================================= */

.card{

  position:absolute;

  left:0;
  right:0;

  top:7%;
  bottom:0;

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  /*
    상단 여백을 크게 확보
  */

  padding:
  8% 9% 7%;

  overflow:hidden;
}


/* =========================================================
   사진

   가로 80% 정도
   기존보다 조금 크게
========================================================= */

.photo{

  position:relative;

  width:82%;

  aspect-ratio:1;

  flex:none;

  border-radius:50%;

  overflow:hidden;

  background:
  var(--accent-bg);

  /*
    사진 자체 은은한 그림자
  */

  box-shadow:
  0 15px 32px
  rgba(113,70,84,.16),

  0 3px 8px
  rgba(113,70,84,.08);

  margin-bottom:5%;

  transition:
  background .25s ease;
}

.photo::after{

  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:
  2px solid
  rgba(255,255,255,.82);

  pointer-events:none;
}

.photo img{

  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}


/* =========================================================
   콘텐츠

   페어명은 작은 상단 텍스트
========================================================= */

.content{

  width:100%;

  min-width:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  overflow:hidden;

  /*
    사진과 텍스트가
    너무 붙지 않도록
  */

  padding-top:1%;
}


/* =========================================================
   페어명

   큰 제목이 아니라
   작은 포인트 텍스트
========================================================= */

.eyebrow{

  width:100%;

  color:var(--accent);

  font-size:11px;

  font-weight:800;

  letter-spacing:3px;

  line-height:1.5;

  margin-bottom:3%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   본문

   큰 페어명 삭제
========================================================= */

.desc{

  width:100%;

  font-size:
  clamp(
    11px,
    1.5vw,
    14px
  );

  line-height:1.8;

  color:#746a70;

  white-space:pre-line;

  word-break:keep-all;

  margin:0;

  max-width:500px;
}


/* =========================================================
   마지막 한 줄 문구
========================================================= */

.note{

  width:100%;

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:
  clamp(
    11px,
    1.3vw,
    13px
  );

  line-height:1.5;

  color:#91868b;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  margin:
  5% 0 0;

  max-width:500px;
}


/* =========================================================
   모바일
========================================================= */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

}


/* =========================================================
   세로 모바일
========================================================= */

@media(max-width:600px){

  .wrap{
    padding:
    20px 10px 40px;
  }

  .editor,
  .preview{
    padding:16px;

    border-radius:20px;
  }

  .stage{
    padding:10px;
  }

  .mac{
    width:100%;
    max-width:none;
  }

  .palette{
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

  .card{

    /*
      모바일에서도
      위쪽 여백 유지
    */

    padding:
    8% 8% 7%;
  }

  .photo{
    width:82%;
  }

}


/* =========================================================
   모바일 가로
========================================================= */

@media(
  max-width:950px
) and (
  orientation:landscape
){

  .wrap{
    padding:
    12px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top h1{
    font-size:25px;
  }

  .stage{
    padding:10px;
  }

  .mac{

    width:auto;

    height:
    calc(100vh - 180px);

    max-width:none;

    aspect-ratio:
    4 / 5;
  }

}


/* =========================================================
   캡처 중에는
   저장 결과도 미리보기와
   최대한 동일하게 유지
========================================================= */

.capture-mode .mac{

  box-shadow:
  0 30px 65px
  rgba(104,61,76,.16);
}

</style>
</head>


<body>


<div class="wrap">


<header class="top">

<div class="mark">
♡
</div>

<h1>
Pair Archive
</h1>

<p>
두 사람의 이야기를 하나의 작은 창에 담아보세요.
</p>

</header>



<div class="layout">


<!-- ======================================================
     편집 영역
====================================================== -->

<section class="editor">


<!-- 페어 정보 -->

<div class="block">

<h3>
<span>01</span>
페어 정보
</h3>


<!-- 맥북 창 이름 -->

<div class="field">

<label>
맥북 창 이름
</label>

<input
id="windowTitle"
type="text"
value="Pair Archive"
>

</div>


<!-- 페어명 -->

<div class="field">

<label>
페어명
</label>

<input
id="pairName"
type="text"
value="祁煜 × 我"
>

</div>


<!-- 소개 -->

<div class="field">

<label>
소개
</label>

<textarea
id="desc"
>심해보다 깊은 마음으로
영원히 함께할 우리의 이야기</textarea>

</div>

</div>



<!-- 사진 -->

<div class="block">

<h3>
<span>02</span>
사진
</h3>


<label class="upload">

＋ 사진 선택

<input
id="file"
type="file"
accept="image/*"
>

</label>


</div>



<!-- 포인트 컬러 -->

<div class="block">

<h3>
<span>03</span>
포인트 컬러
</h3>


<div class="palette">


<button
class="sw active"
data-c="#f39ab5"
style="background:#f39ab5"
></button>


<button
class="sw"
data-c="#f6a6c1"
style="background:#f6a6c1"
></button>


<button
class="sw"
data-c="#f6b7a9"
style="background:#f6b7a9"
></button>


<button
class="sw"
data-c="#f7cf8e"
style="background:#f7cf8e"
></button>


<button
class="sw"
data-c="#b9d99f"
style="background:#b9d99f"
></button>


<button
class="sw"
data-c="#9fd9d0"
style="background:#9fd9d0"
></button>


<button
class="sw"
data-c="#9fc8ee"
style="background:#9fc8ee"
></button>


<button
class="sw"
data-c="#c5b2e8"
style="background:#c5b2e8"
></button>


<button
class="sw"
data-c="#e8a9d4"
style="background:#e8a9d4"
></button>


<button
class="sw"
data-c="#f3b8d7"
style="background:#f3b8d7"
></button>


<button
class="sw"
data-c="#f1d29d"
style="background:#f1d29d"
></button>


<button
class="sw"
data-c="#b8dfc4"
style="background:#b8dfc4"
></button>


<button
class="sw"
data-c="#a9dce8"
style="background:#a9dce8"
></button>


<button
class="sw"
data-c="#b3c9ee"
style="background:#b3c9ee"
></button>


<button
class="sw"
data-c="#d4b9ee"
style="background:#d4b9ee"
></button>


<button
class="sw"
data-c="#f2a8a8"
style="background:#f2a8a8"
></button>


</div>

</div>



<!-- 이야기 -->

<div class="block">

<h3>
<span>04</span>
이야기
</h3>


<!-- 기존 섹션 제목 → 페어명으로 변경 -->

<div class="field">

<label>
페어명
</label>

<input
id="pairName2"
type="text"
value="祁煜 × 我"
>

</div>


<!-- 본문 -->

<div class="field">

<label>
페어에 대한 이야기
</label>

<textarea
id="desc2"
>심해보다 깊은 마음으로
영원히 함께할 우리의 이야기</textarea>

</div>


<!-- 마지막 문구는 한 줄 -->

<div class="field">

<label>
마지막 한 줄 문구
</label>

<input
id="note"
type="text"
value="서로의 세계가 되어준 우리"
>

</div>


</div>



<button
id="save"
class="save"
type="button"
>
이미지로 저장
</button>


</section>



<!-- ======================================================
     미리보기
====================================================== -->

<section class="preview">


<div class="previewHead">

<h3>
Preview
</h3>

<small>
4 : 5 · PNG
</small>

</div>



<div class="stage">


<!--
  이 #mac 전체가
  그대로 PNG로 저장됨
-->

<div
id="mac"
class="mac"
>


<!-- 맥북 상단 -->

<div class="macbar">


<div class="dots">

<i class="dot r"></i>

<i class="dot y"></i>

<i class="dot g"></i>

</div>


<span
id="outTitle"
class="title"
>
Pair Archive
</span>


</div>



<!-- 카드 -->

<div class="card">


<!-- 사진 -->

<div
class="photo"
>

<img
id="outImg"
hidden
>

</div>



<!-- 텍스트 -->

<div class="content">


<!-- 페어명 -->

<div
id="outPairName"
class="eyebrow"
>
祁煜 × 我
</div>


<!-- 소개 -->

<p
id="outDesc"
class="desc"
>
심해보다 깊은 마음으로
영원히 함께할 우리의 이야기
</p>


<!-- 마지막 한 줄 -->

<p
id="outNote"
class="note"
>
서로의 세계가 되어준 우리
</p>


</div>


</div>


</div>


</div>


</section>


</div>


</div>



<script>

(() => {

  /* =========================================================
     상태
  ========================================================= */

  const state = {
    src: null,
    color: '#f39ab5'
  };


  /* =========================================================
     DOM
  ========================================================= */

  const $ = id => document.getElementById(id);

  const windowTitle = $('windowTitle');
  const pairName = $('pairName');
  const pairName2 = $('pairName2');

  const desc = $('desc');
  const desc2 = $('desc2');

  const note = $('note');

  const file = $('file');

  const outTitle = $('outTitle');
  const outPairName = $('outPairName');
  const outDesc = $('outDesc');
  const outNote = $('outNote');

  const outImg = $('outImg');

  const save = $('save');

  const mac = $('mac');


  /* =========================================================
     HEX → RGB
  ========================================================= */

  function hexToRgb(hex){

    hex = hex.replace('#','');

    return {
      r: parseInt(hex.substring(0,2),16),
      g: parseInt(hex.substring(2,4),16),
      b: parseInt(hex.substring(4,6),16)
    };

  }


  /* =========================================================
     포인트 컬러 테마
  ========================================================= */

  function updateTheme(){

    const rgb = hexToRgb(state.color);


    const bg = `
      rgb(
        ${Math.round(rgb.r + (255-rgb.r)*0.90)},
        ${Math.round(rgb.g + (255-rgb.g)*0.90)},
        ${Math.round(rgb.b + (255-rgb.b)*0.90)}
      )
    `;


    const border = `
      rgb(
        ${Math.round(rgb.r + (255-rgb.r)*0.68)},
        ${Math.round(rgb.g + (255-rgb.g)*0.68)},
        ${Math.round(rgb.b + (255-rgb.b)*0.68)}
      )
    `;


    const line = `
      rgb(
        ${Math.round(rgb.r + (255-rgb.r)*0.78)},
        ${Math.round(rgb.g + (255-rgb.g)*0.78)},
        ${Math.round(rgb.b + (255-rgb.b)*0.78)}
      )
    `;


    document.documentElement.style
      .setProperty('--accent',state.color);

    document.documentElement.style
      .setProperty('--accent-bg',bg);

    document.documentElement.style
      .setProperty('--accent-border',border);

    document.documentElement.style
      .setProperty('--accent-line',line);

  }


  /* =========================================================
     텍스트 동기화
  ========================================================= */

  function syncText(){

    outTitle.textContent =
      windowTitle.value || 'Pair Archive';


    /*
      페어명 입력창 두 개를
      동일하게 유지
    */

    if(document.activeElement === pairName2){

      pairName.value =
        pairName2.value;

    }else{

      pairName2.value =
        pairName.value;

    }


    outPairName.textContent =
      pairName.value || 'Pair Name';


    /*
      소개도 동일하게 유지
    */

    if(document.activeElement === desc2){

      desc.value =
        desc2.value;

    }else{

      desc2.value =
        desc.value;

    }


    outDesc.textContent =
      desc.value;


    outNote.textContent =
      note.value;

  }


  /* =========================================================
     사진 업로드
  ========================================================= */

  file.addEventListener(
    'change',
    event => {

      const f =
        event.target.files?.[0];

      if(!f){
        return;
      }


      if(!f.type.startsWith('image/')){

        alert(
          '이미지 파일을 선택해 주세요.'
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
      event => {

        state.src =
          event.target.result;


        /*
          이미지가 로드된 뒤
          미리보기 표시
        */

        outImg.onload = () => {

          outImg.hidden = false;

        };


        outImg.src =
          state.src;

      };


      reader.readAsDataURL(f);

    }
  );


  /* =========================================================
     색상 선택
  ========================================================= */

  document
  .querySelectorAll('.sw')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        state.color =
          button.dataset.c;


        document
        .querySelectorAll('.sw')
        .forEach(x => {

          x.classList.remove(
            'active'
          );

        });


        button.classList.add(
          'active'
        );


        updateTheme();

      }
    );

  });


  /* =========================================================
     텍스트 입력
  ========================================================= */

  [
    windowTitle,
    pairName,
    pairName2,
    desc,
    desc2,
    note

  ].forEach(element => {

    element.addEventListener(
      'input',
      syncText
    );

  });


  /* =========================================================
     이미지 로딩 대기
  ========================================================= */

  function waitForImage(img){

    return new Promise(resolve => {

      if(
        img.complete &&
        img.naturalWidth > 0
      ){

        resolve();

        return;

      }


      img.onload =
        () => resolve();


      img.onerror =
        () => resolve();

    });

  }


  /* =========================================================
     저장용 캡처

     핵심:

     1. 현재 미리보기의 실제 크기를 측정
     2. 미리보기 DOM을 복제
     3. 사진을 background-image로 변환
     4. object-fit 문제 제거
     5. 원본 미리보기와 동일한 크기로 캡처
  ========================================================= */

  async function capturePreview(){

    await waitForImage(outImg);


    /*
      브라우저가 마지막 스타일을
      적용할 때까지 기다림
    */

    await new Promise(resolve => {

      requestAnimationFrame(() => {

        requestAnimationFrame(resolve);

      });

    });


    /*
      현재 미리보기의 실제 크기
    */

    const rect =
      mac.getBoundingClientRect();


    const width =
      Math.round(rect.width);


    const height =
      Math.round(rect.height);


    /*
      미리보기 전체를 복제

      복제본은 화면 밖에서
      캡처하기 때문에
      원본 미리보기에는 영향 없음
    */

    const clone =
      mac.cloneNode(true);


    /*
      캡처용 컨테이너
    */

    const wrapper =
      document.createElement('div');


    wrapper.style.position =
      'fixed';

    wrapper.style.left =
      '-100000px';

    wrapper.style.top =
      '0';

    wrapper.style.width =
      width + 'px';

    wrapper.style.height =
      height + 'px';

    wrapper.style.overflow =
      'hidden';

    wrapper.style.background =
      getComputedStyle(mac)
      .backgroundColor;


    /*
      복제본 크기 고정

      모바일에서 캡처할 때
      CSS 미디어쿼리가 바뀌는 것을 방지
    */

    clone.style.width =
      width + 'px';

    clone.style.height =
      height + 'px';

    clone.style.maxWidth =
      'none';

    clone.style.minWidth =
      width + 'px';

    clone.style.aspectRatio =
      'auto';

    clone.style.transform =
      'none';


    wrapper.appendChild(clone);

    document.body.appendChild(wrapper);


    /*
      =====================================================
      사진 처리

      html2canvas에서 object-fit 때문에
      가로로 늘어나는 문제를 방지하기 위해

      실제 미리보기 사진의
      현재 렌더링 상태를 그대로
      background-image로 변환

      background-size: cover
      background-position: center

      → 사진 비율 유지
      → 원형 유지
    =====================================================
    */

    const originalPhoto =
      mac.querySelector('.photo');

    const clonePhoto =
      clone.querySelector('.photo');

    const cloneImage =
      clone.querySelector('#outImg');


    if(
      originalPhoto &&
      clonePhoto &&
      state.src
    ){

      const originalStyle =
        getComputedStyle(
          originalPhoto
        );


      const imageStyle =
        getComputedStyle(
          outImg
        );


      /*
        현재 사진 영역 크기
      */

      const photoRect =
        originalPhoto
        .getBoundingClientRect();


      /*
        이미지가
        원형 영역을 꽉 채우도록
        background 방식으로 처리
      */

      clonePhoto.style.backgroundImage =
        `url("${state.src}")`;


      clonePhoto.style.backgroundSize =
        'cover';


      clonePhoto.style.backgroundPosition =
        'center center';


      clonePhoto.style.backgroundRepeat =
        'no-repeat';


      /*
        기존 img는 숨김

        이렇게 하면
        html2canvas가 img의
        object-fit을 처리하지 않음
      */

      cloneImage.style.display =
        'none';


      /*
        원본 사진의
        테두리와 그림자 유지
      */

      clonePhoto.style.borderRadius =
        originalStyle.borderRadius;


      clonePhoto.style.boxShadow =
        originalStyle.boxShadow;


      clonePhoto.style.backgroundColor =
        originalStyle.backgroundColor;

    }


    /*
      캡처용 복제본을
      현재 미리보기와 동일하게
      브라우저가 렌더링하도록 대기
    */

    await new Promise(resolve => {

      requestAnimationFrame(() => {

        requestAnimationFrame(resolve);

      });

    });


    /*
      =====================================================
      html2canvas

      clone 전체를 캡처

      scale 3으로 고해상도 저장

      실제 디자인 비율은
      원본과 동일
    =====================================================
    */

    const canvas =
      await html2canvas(
        clone,
        {

          /*
            원본 미리보기와 동일한
            비율로 확대
          */

          scale:3,

          width:width,

          height:height,

          useCORS:true,

          allowTaint:false,

          backgroundColor:
            getComputedStyle(
              mac
            ).backgroundColor,

          imageTimeout:15000,

          logging:false,

          /*
            CSS 픽셀 크기 유지
          */

          windowWidth:
            document.documentElement
            .clientWidth,

          windowHeight:
            document.documentElement
            .clientHeight

        }
      );


    /*
      복제본 제거
    */

    wrapper.remove();


    return canvas;

  }


  /* =========================================================
     PNG 저장
  ========================================================= */

  save.addEventListener(
    'click',
    async () => {


      if(!state.src){

        alert(
          '먼저 사진을 선택해 주세요.'
        );

        return;

      }


      if(
        typeof html2canvas ===
        'undefined'
      ){

        alert(
          '이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'
        );

        return;

      }


      save.disabled =
        true;


      save.textContent =
        '이미지 생성 중...';


      try{


        /*
          현재 미리보기
          그대로 캡처
        */

        const canvas =
          await capturePreview();


        /*
          PNG 생성
        */

        const blob =
          await new Promise(
            resolve => {

              canvas.toBlob(
                resolve,
                'image/png',
                1
              );

            }
          );


        if(!blob){

          throw new Error(
            'PNG 생성 실패'
          );

        }


        /*
          다운로드
        */

        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            'a'
          );


        link.href =
          url;


        link.download =
          'pair-archive.png';


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              url
            );

          },
          1500
        );


      }
      catch(error){


        console.error(
          'PNG 저장 오류:',
          error
        );


        alert(
          '이미지를 저장하는 중 문제가 발생했습니다.\n잠시 후 다시 시도해 주세요.'
        );


      }
      finally{


        save.disabled =
          false;


        save.textContent =
          '이미지로 저장';

      }

    }
  );


  /* =========================================================
     초기 실행
  ========================================================= */

  syncText();

  updateTheme();


})();

</script>
