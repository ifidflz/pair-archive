<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Pair Archive — 페어 카드 스튜디오</title>

<style>

:root{
  --accent:#f39ab5;
  --accent-soft:#fff0f5;
  --ink:#302a2d;
  --muted:#8f8187;
  --paper:#fffdfb;
  --line:#eee2e6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:100%;
  max-width:1320px;
  margin:0 auto;
  padding:38px 24px 70px;
}

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
  margin-bottom:6px;
}

.top h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:34px;
  letter-spacing:-.5px;
  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}

.layout{
  display:grid;
  grid-template-columns:370px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.editor,
.preview{
  background:rgba(255,253,251,.95);
  border:1px solid #f0dfe4;
  border-radius:24px;
  box-shadow:0 18px 45px rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}

.block{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line);
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;
  margin:0 0 16px;
  letter-spacing:.2px;
}

.block h3 span{
  color:var(--accent);
  font-family:Georgia,serif;
  font-size:16px;
  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:11px;
  color:#8f8187;
  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:12px;
  padding:11px 12px;
  color:var(--ink);
  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;
  box-shadow:0 0 0 4px #fdebf1;
}

textarea{
  min-height:105px;
  resize:vertical;
  line-height:1.7;
}

/* 사진 업로드 */

.upload{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px dashed #e5b7c5;
  background:#fff8fa;
  border-radius:12px;
  color:#9a6576;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}

.upload:hover{
  background:#fff1f5;
}

.upload input{
  display:none;
}


/* 사진 조절 영역 */

.crop{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  margin-top:14px;
  border-radius:50%;
  overflow:hidden;
  background:#f8edf0;
  touch-action:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.8),
    0 12px 28px rgba(113,70,84,.12);
}

.crop::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.9);
  pointer-events:none;
}

.crop img{
  position:absolute;
  left:50%;
  top:50%;
  width:auto;
  height:auto;
  max-width:none;
  transform-origin:center center;
  user-select:none;
  cursor:grab;
  will-change:transform;
}

.crop img:active{
  cursor:grabbing;
}

.hint{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#b29ba2;
  font-size:12px;
  text-align:center;
  line-height:1.7;
  padding:30px;
  pointer-events:none;
}

.cropTools{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.cropTools button{
  width:36px;
  height:32px;
  border:1px solid #eadde1;
  background:white;
  border-radius:9px;
  cursor:pointer;
  color:#735966;
}

.cropTools button:hover{
  background:#fff4f7;
}

.zoom{
  font-size:11px;
  color:#8f8187;
  min-width:48px;
  text-align:center;
}


/* 컬러 */

.palette{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.sw{
  width:28px;
  height:28px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #eadde1;
  cursor:pointer;
  padding:0;
}

.sw.active{
  box-shadow:0 0 0 2px #4e3a42;
}


/* 비율 */

.ratioGroup{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.ratioBtn{
  padding:11px 8px;
  border-radius:11px;
  border:1px solid #eadde1;
  background:white;
  color:#806d75;
  cursor:pointer;
  line-height:1.5;
}

.ratioBtn.active{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:#8f5268;
  font-weight:700;
}


/* 저장 */

.save{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#302a2d;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.save:hover{
  background:#4a3d42;
}

.save:active{
  transform:scale(.98);
}


/* 미리보기 */

.previewHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}

.stage{
  width:100%;
  border-radius:18px;
  background:
    radial-gradient(
      circle at 50% 20%,
      #fffdfd 0,
      #f9eef2 58%,
      #f5e6eb 100%
    );
  padding:40px;
  min-height:730px;
  display:grid;
  place-items:center;
  overflow:hidden;
}


/* 맥북 카드 */

.mac{
  width:min(820px,100%);
  background:#fff;
  border:1px solid #e3dfe1;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 65px rgba(104,61,76,.19);
  position:relative;
  flex:none;
}

.mac.ratio-square{
  aspect-ratio:1 / 1;
}

.mac.ratio-portrait{
  aspect-ratio:4 / 5;
}


.macbar{
  height:44px;
  background:rgba(250,249,250,.96);
  border-bottom:1px solid #e7e4e5;
  display:flex;
  align-items:center;
  padding:0 15px;
  position:relative;
  z-index:2;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:#999094;
  letter-spacing:.2px;
  max-width:60%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* 카드 */

.card{
  width:100%;
  height:calc(100% - 44px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  overflow:hidden;
}


/*
  핵심:
  사진을 카드 가로폭의 약 80%로 설정
*/

.ratio-square .card{
  padding:
    6%
    8%
    5%;
}

.ratio-portrait .card{
  padding:
    5%
    8%
    4%;
}


/* 미리보기 사진 */

.photo{
  position:relative;
  width:80%;
  aspect-ratio:1 / 1;
  flex:none;
  overflow:hidden;
  border-radius:50%;
  background:#f7e9ee;
  box-shadow:
    0 16px 35px rgba(113,70,84,.16);
  margin-bottom:5%;
}

.photo::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  pointer-events:none;
}

.photo img{
  position:absolute;
  left:50%;
  top:50%;
  width:auto;
  height:auto;
  max-width:none;
  transform-origin:center center;
  will-change:transform;
}


/* 텍스트 */

.content{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  overflow:hidden;
}

.eyebrow{
  font-size:10px;
  letter-spacing:3px;
  color:var(--accent);
  font-weight:800;
  margin-bottom:2%;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.name{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(25px,5vw,42px);
  line-height:1.2;
  letter-spacing:-1px;
  margin:0 0 2%;
  max-width:100%;
  word-break:break-word;
}

.desc{
  width:100%;
  font-size:clamp(10px,1.7vw,14px);
  line-height:1.8;
  color:#746a70;
  white-space:pre-line;
  margin:0;
  word-break:keep-all;
}

.rule{
  width:55px;
  height:2px;
  background:var(--accent);
  margin:4% auto;
  flex:none;
}

.note{
  width:100%;
  font-size:clamp(9px,1.5vw,12px);
  line-height:1.8;
  color:#91868b;
  white-space:pre-line;
  margin:0;
  word-break:keep-all;
}


/* 반응형 */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

  .stage{
    min-height:0;
  }

}


@media(max-width:600px){

  .wrap{
    padding:22px 12px 50px;
  }

  .editor,
  .preview{
    padding:16px;
    border-radius:20px;
  }

  .palette{
    grid-template-columns:repeat(8,1fr);
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

  .stage{
    padding:14px;
  }

  .mac{
    width:100%;
    max-width:100%;
    border-radius:14px;
  }

  .macbar{
    height:36px;
    padding:0 10px;
  }

  .dot{
    width:9px;
    height:9px;
  }

  .dots{
    gap:5px;
  }

  .card{
    height:calc(100% - 36px);
  }

}


@media(
  max-width:900px
) and (
  orientation:landscape
){

  .wrap{
    padding:14px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top .mark{
    font-size:20px;
  }

  .top h1{
    font-size:25px;
  }

  .top p{
    margin-top:5px;
  }

  .stage{
    padding:14px;
    min-height:0;
  }

  .mac{
    width:min(
      100%,
      calc(100vw - 60px)
    );
  }

}

</style>
</head>


<body>

<header class="top">

<div class="mark">
♡
</div>

<h1>
Pair Archive
</h1>

<p>
두 사람의 이야기를 하나의 작은 창에 담아보세요.

</header>


<div class="layout">


<!-- ======================
     EDITOR
====================== -->

<section class="editor">


<div class="block">

<h3>
<span>01</span>
페어 정보
</h3>


<div class="field">

<label>
맥북 창 이름

</div>


<div class="field">

<div

<button class="sw" data-c="#f7cf8e" style="background:#f7cf8e"></button>

<button class="sw" data-c="#b9d99f" style="background:#b9d99f"></button>

<button class="sw" data-c="#9fd9d0" style="background:#9fd9d0"></button>

<button class="sw" data-c="#9fc8ee" style="background:#9fc8ee"></button>

<button class="sw" data-c="#c5b2e8" style="background:#c5b2e8"></button>

<button class="sw" data-c="#e8a9d4" style="background:#e8a9d4"></button>

<button class="sw" data-c="#f3b8d7" style="background:#f3b8d7"></button>

<button class="sw" data-c="#f1d29d" style="background:#f1d29d"></button>

<button class="sw" data-c="#b8dfc4" style="background:#b8dfc4"></button>

<button class="sw" data-c="#a9dce8" style="background:#a9dce8"></button>

<button class="sw" data-c="#b3c9ee" style="background:#b3c9ee"></button>

<button class="sw" data-c="#d4b9ee" style="background:#d4b9ee"></button>

<button class="sw" data-c="#f2a8a8" style="background:#f2a8a8"></button>

<div class="block">

<h3>

<div class="field">

<script>

(() => {


/* =========================
   상태
========================= */

const state = {

  src:null,

  /*
    사진 이동값

    사진 조절창의 중심을 기준으로
    실제 이미지가 이동한 픽셀
  */

  x:0,

  y:0,

  /*
    사진 확대
  */

  scale:1,

  color:'#f39ab5',

  ratio:'4:5'

};



/* =========================
   DOM
========================= */

const $ =
id =>
document.getElementById(id);


const windowTitle =
$('windowTitle');

const name =
$('name');

const desc =
$('desc');

const eyebrow =
$('eyebrow');

const note =
$('note');

const file =
$('file');

const crop =
$('crop');

const cropImg =
$('cropImg');

const hint =
$('hint');

const photo =
$('photo');

const outImg =
$('outImg');

const outTitle =
$('outTitle');

const outName =
$('outName');

const outDesc =
$('outDesc');

const outEye =
$('outEye');

const outNote =
$('outNote');

const zoom =
$('zoom');

const card =
$('card');

const save =
$('save');



/* =========================
   텍스트 동기화
========================= */

function syncText(){


  outTitle.textContent =
    windowTitle.value ||
    'Pair Archive';


  outName.textContent =
    name.value ||
    'Pair Name';


  outDesc.textContent =
    desc.value;


  outEye.textContent =
    eyebrow.value ||
    'OUR STORY';


  outNote.textContent =
    note.value;


  document.documentElement.style.setProperty(
    '--accent',
    state.color
  );


}



/* =========================
   사진 크기 계산

   조절창과 미리보기 모두
   같은 방식으로 이미지 크기를 계산
========================= */

function calculateImageSize(

  containerWidth,

  containerHeight,

  imageWidth,

  imageHeight,

  scale

){

  /*
    원형 프레임 안에서
    이미지가 빈 공간 없이
    꽉 차도록 계산
  */

  const baseScale =

    Math.max(

      containerWidth /
      imageWidth,

      containerHeight /
      imageHeight

    );


  return {

    width:
      imageWidth *
      baseScale *
      scale,

    height:
      imageHeight *
      baseScale *
      scale

  };

}



/* =========================
   사진 렌더링
========================= */

function renderPhoto(){


  if(!state.src){
    return;
  }


  /*
    조절창

    CSS는 실제 이미지 크기를
    JS로 직접 계산해서 적용
  */

  const cropWidth =
    crop.clientWidth;


  const cropHeight =
    crop.clientHeight;


  const cropSize =

    Math.min(
      cropWidth,
      cropHeight
    );


  const cropScale =
    calculateImageSize(

      cropSize,

      cropSize,

      cropImg.naturalWidth,

      cropImg.naturalHeight,

      state.scale

    );


  cropImg.style.width =
    cropScale.width +
    'px';


  cropImg.style.height =
    cropScale.height +
    'px';


  cropImg.style.transform =

    `translate(

      calc(-50% + ${state.x}px),

      calc(-50% + ${state.y}px)

    )`;


  /*
    미리보기

    조절창과 미리보기의
    실제 프레임 크기 차이를
    비율로 환산
  */

  const previewWidth =
    photo.clientWidth;


  const previewHeight =
    photo.clientHeight;


  const previewScale =
    calculateImageSize(

      previewWidth,

      previewHeight,

      cropImg.naturalWidth,

      cropImg.naturalHeight,

      state.scale

    );


  /*
    이동량을
    조절창 크기 → 미리보기 크기
    비율로 변환

    임의의 0.55 같은 값은 사용하지 않음
  */

  const ratioX =

    previewWidth /
    cropSize;


  const ratioY =

    previewHeight /
    cropSize;


  outImg.style.width =
    previewScale.width +
    'px';


  outImg.style.height =
    previewScale.height +
    'px';


  outImg.style.transform =

    `translate(

      calc(-50% + ${
        state.x *
        ratioX
      }px),

      calc(-50% + ${
        state.y *
        ratioY
      }px)

    )`;


  zoom.textContent =

    Math.round(
      state.scale *
      100
    ) +

    '%';

}



/* =========================
   이미지 로드
========================= */

function handleImageLoad(){


  cropImg.hidden =
    false;


  outImg.hidden =
    false;


  hint.hidden =

  renderPhoto();

}



/* =========================
   파일 선택
========================= */

file.addEventListener(

  'change',

  event => {


    const selected =
      event.target.files?.[0];


    if(!selected){
      return;
    }


    if(
      !selected.type.startsWith(
        'image/'
      )
    ){

      alert(
        '이미지 파일을 선택해 주세요.'
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =

    event => {


      state.src =
        event.target.result;


      state.x =
        0;


      state.y =
        0;


      state.scale =
        1;


      cropImg.onload =
        handleImageLoad;


      cropImg.src =
        state.src;


      outImg.src =
        state.src;


    };


    reader.onerror =

    () => {

      alert(
        '사진을 불러오지 못했습니다.'
      );

    };


    reader.readAsDataURL(
      selected
    );


  }

);



/* =========================
   확대
========================= */

$('plus').addEventListener(

  'click',

  () => {


    if(!state.src){
      return;
    }


    state.scale =

      Math.min(

        3,

        state.scale +
        0.1

      );

  }

);



/* =========================
   축소
========================= */

$('minus').addEventListener(

  'click',

  () => {


    if(!state.src){
      return;
    }


    state.scale =

      Math.max(

        state.scale -
        0.1

      );

  }

);



/* =========================
   초기화
========================= */

$('reset').addEventListener(

  'click',

  () => {


    state.x =
      0;


    state.y =
      0;


    state.scale =
      1;


    renderPhoto();


  }

);



/* =========================
   휠 확대
========================= */

crop.addEventListener(

  'wheel',

  event => {


    if(!state.src){
      return;
    }


    event.preventDefault();


    state.scale =

      Math.max(

        0.5,

        Math.min(

          3,

          state.scale +

          (
            event.deltaY < 0

            ? 0.08

            : -0.08

          )

        )

      );


    renderPhoto();


  },

  {
    passive:false
  }

);



/* =========================
   드래그
========================= */

let dragging =
false;


let lastX =
0;


let lastY =
0;



cropImg.addEventListener(

  'pointerdown',

  event => {


    if(!state.src){
      return;
    }


    dragging =
      true;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    cropImg.setPointerCapture(

      event.pointerId

    );


  }

);



cropImg.addEventListener(

  'pointermove',

  event => {


    if(!dragging){
      return;
    }


    state.x +=

      event.clientX -
      lastX;


    state.y +=

      event.clientY -
      lastY;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    renderPhoto();


  }

);



function stopDragging(){


  dragging =
    false;


}



cropImg.addEventListener(

  'pointerup',

  stopDragging

);


cropImg.addEventListener(

  'pointercancel',

  stopDragging

);

document

[

/* =========================
   Canvas 둥근 사각형
========================= */

function roundedRect(

  ctx,

  x,

  y,

  width,

  height,

  radius

){


  ctx.beginPath();


  ctx.moveTo(

    x + radius,

    y

  );


  ctx.arcTo(

    x + width,

    y,

    x + width,

    y + height,

    radius

  );


  ctx.arcTo(

    x + width,

    y + height,

    x,

    y + height,

    radius

  );


  ctx.arcTo(

    x,

    y + height,

    x,

    y,

    radius

  );


  ctx.arcTo(

    x,

    y,

    x + width,

    y,

    radius

  );


  ctx.closePath();

}



/* =========================
   Canvas 텍스트 줄바꿈
========================= */

function drawCenteredLines(

  ctx,

  text,

  x,

  y,

  lineHeight,

  font,

  color

){


  ctx.font =
    font;


  ctx.fillStyle =
    color;


  ctx.textAlign =
    'center';


  const lines =

    String(
      text || ''
    )
    .split('\n');


  lines.forEach(

    (line,index) => {


      ctx.fillText(

        line,

        x,

        y +
        index *
        lineHeight

      );


    }

  );


  return (

    y +

    lines.length *
    lineHeight

  );

}



/* =========================
   이미지 저장
========================= */

save.addEventListener(

  'click',

  async () => {


    if(!state.src){

      alert(
        '먼저 사진을 선택해 주세요.'
      );

      return;

    }


    /*
      저장 캔버스

      1:1 = 1800 x 1800

      4:5 = 1800 x 2250
    */

    const W =
      1800;


    const H =

      state.ratio ===
      '1:1'

      ? 1800

      : 2250;


    const canvas =
      document.createElement(
        'canvas'
      );


    canvas.width =
      W;


    canvas.height =
      H;


    const ctx =
      canvas.getContext(
        '2d'
      );


    if(!ctx){

      alert(
        '이미지를 저장할 수 없습니다.'
      );

      return;

    }


    /*
      배경
    */

    ctx.fillStyle =
      '#ffffff';


    ctx.fillRect(

      0,

      0,

      W,

      H

    );


    /*
      맥북 상단바
    */

    const barHeight =
      92;


    ctx.fillStyle =
      '#faf9fa';


    ctx.fillRect(

      0,

      0,

      W,

      barHeight

    );


    /*
      맥북 버튼
    */

    [

      '#ff625a',

      '#ffc04b',

      '#31c85a'

    ].forEach(

      (color,index) => {


        ctx.fillStyle =
          color;


        ctx.beginPath();


        ctx.arc(

          38 +
          index *
          42,

          46,

          13,

          0,

          Math.PI *
          2

        );


        ctx.fill();


      }

    );


    /*
      창 이름
    */

    ctx.fillStyle =
      '#999094';


    ctx.font =
      '17px sans-serif';


    ctx.textAlign =
      'center';


    ctx.fillText(

      windowTitle.value ||
      'Pair Archive',

      W / 2,

      53

    );


    /*
      사진 크기

      결과물 가로 폭의 80%
    */

    const photoSize =
      W *
      0.80;


    const photoX =
      (
        W -
        photoSize
      ) /
      2;


    /*
      1:1과 4:5 모두
      원형 사진
    */

    let photoY;


    if(
      state.ratio ===
      '1:1'
    ){

      photoY =
        180;

    }else{

      photoY =
        160;

    }


    /*
      원본 이미지 로드
    */

    const image =
      new Image();


    image.onload = () => {


      /*
        조절창과 동일한
        contain/cover 계산
      */

      const baseScale =

        Math.max(

          photoSize /
          image.naturalWidth,

          photoSize /
          image.naturalHeight

        );


      const drawWidth =

        image.naturalWidth *
        baseScale *
        state.scale;


      const drawHeight =

        image.naturalHeight *
        baseScale *
        state.scale;


      /*
        조절창 기준 이동값을
        저장 이미지 기준으로 환산

        조절창 크기 : 약 300px

        저장 이미지 : 1440px

        따라서 비율 계산
      */

      const cropSize =
        crop.clientWidth;


      const outputRatio =

        photoSize /
        cropSize;


      const outputX =

        state.x *
        outputRatio;


      const outputY =

        state.y *
        outputRatio;


      /*
        원형 마스크
      */

      ctx.save();


      ctx.beginPath();


      ctx.arc(

        W / 2,

        photoY +
        photoSize / 2,

        photoSize / 2,

        0,

        Math.PI *
        2

      );


      ctx.clip();


      /*
        사진 그리기
      */

      ctx.drawImage(

        image,

        photoX +
        (
          photoSize -
          drawWidth
        ) /
        2 +
        outputX,

        photoY +
        (
          photoSize -
          drawHeight
        ) /
        2 +
        outputY,

        drawWidth,

        drawHeight

      );


      ctx.restore();


      /*
        텍스트 시작 위치
      */

      let y =

        state.ratio ===
        '1:1'

        ? 1060

        : 1300;


      /*
        섹션 제목
      */

      ctx.fillStyle =
        state.color;


      ctx.font =
        'bold 22px sans-serif';


      ctx.textAlign =
        'center';


      ctx.fillText(

        (
          eyebrow.value ||
          'OUR STORY'
        ).toUpperCase(),

        W / 2,

        y

      );


      y +=
        80;


      /*
        페어 이름
      */

      ctx.fillStyle =
        '#302a2d';


      ctx.font =
        '500 62px Georgia, serif';


      ctx.fillText(

        name.value ||
        'Pair Name',

        W / 2,

        y

      );


      y +=
        80;


      /*
        소개
      */

      y =

        drawCenteredLines(

          ctx,

          desc.value,

          W / 2,

          y,

          38,

          '23px sans-serif',

          '#746a70'

        );


      /*
        포인트 라인
      */

      ctx.fillStyle =
        state.color;


      ctx.fillRect(

        W / 2 -
        27,

        y +
        24,

        54,

        2

      );


      /*
        이야기
      */

      drawCenteredLines(

        ctx,

        note.value,

        W / 2,

        y +
        85,

        34,

        '20px sans-serif',

        '#91868b'

      );


      /*
        PNG Blob 생성
      */

      canvas.toBlob(

        blob => {


          if(!blob){

            alert(
              '이미지를 저장하지 못했습니다. 다시 시도해 주세요.'
            );

            return;

          }


          const url =

            URL.createObjectURL(
              blob
            );


          const link =

            document.createElement(
              'a'
            );


          link.href =
            url;


          link.download =

            state.ratio ===
            '1:1'

            ? 'pair-archive-1x1.png'

            : 'pair-archive-4x5.png';


          link.style.display =
            'none';


          document.body.appendChild(
            link
          );


          link.click();


          setTimeout(

            () => {

              link.remove();

              URL.revokeObjectURL(
                url
              );

            },

            1000

          );


        },

        'image/png'

      );


    };


    image.onerror =

    () => {

      alert(
        '사진을 불러오지 못했습니다. 다시 시도해 주세요.'
      );

    };


    image.src =
      state.src;


  }

);



/* =========================
   초기 실행
========================= */

syncText();


})();

</script>
