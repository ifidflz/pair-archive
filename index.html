<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Pair Archive — 페어 카드 스튜디오</title>

<style>
:root{
  --accent:#f39ab5;
  --accent-soft:#fff0f5;
  --ink:#302a2d;
  --muted:#8f8187;
  --paper:#fffdfb;
  --line:#eee2e6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:100%;
  max-width:1320px;
  margin:0 auto;
  padding:38px 24px 70px;
}

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
  margin-bottom:6px;
}

.top h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:34px;
  letter-spacing:-.5px;
  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}

.layout{
  display:grid;
  grid-template-columns:370px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.editor,
.preview{
  background:rgba(255,253,251,.94);
  border:1px solid #f0dfe4;
  border-radius:24px;
  box-shadow:0 18px 45px rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}

.block{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line);
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;
  margin:0 0 16px;
  letter-spacing:.2px;
}

.block h3 span{
  color:var(--accent);
  font-family:Georgia,serif;
  font-size:16px;
  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:11px;
  color:#8f8187;
  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:12px;
  padding:11px 12px;
  color:var(--ink);
  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;
  box-shadow:0 0 0 4px #fdebf1;
}

textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.7;
}

.upload{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px dashed #e5b7c5;
  background:#fff8fa;
  border-radius:12px;
  color:#9a6576;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}

.upload:hover{
  background:#fff1f5;
}

.upload input{
  display:none;
}

/* 사진 조절 영역 */

.crop{
  position:relative;
  width:100%;
  height:220px;
  margin-top:10px;
  border-radius:14px;
  overflow:hidden;
  background:#f8edf0;
  touch-action:none;
}

.crop img{
  position:absolute;
  left:50%;
  top:50%;
  max-width:none;
  transform-origin:center center;
  user-select:none;
  cursor:grab;
  will-change:transform;
}

.crop img:active{
  cursor:grabbing;
}

.hint{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#b29ba2;
  font-size:12px;
  text-align:center;
  padding:30px;
  pointer-events:none;
}

.frame{
  position:absolute;
  inset:18px;
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 999px rgba(90,50,65,.13);
  border-radius:12px;
  pointer-events:none;
}

.cropTools{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.cropTools button{
  width:36px;
  height:32px;
  border:1px solid #eadde1;
  background:white;
  border-radius:9px;
  cursor:pointer;
  color:#735966;
}

.cropTools button:hover{
  background:#fff4f7;
}

.zoom{
  font-size:11px;
  color:#8f8187;
  min-width:48px;
  text-align:center;
}

/* 컬러 */

.palette{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.sw{
  width:28px;
  height:28px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #eadde1;
  cursor:pointer;
  padding:0;
}

.sw.active{
  box-shadow:0 0 0 2px #4e3a42;
}

/* 비율 */

.ratioGroup{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.ratioBtn{
  padding:11px 8px;
  border-radius:11px;
  border:1px solid #eadde1;
  background:white;
  color:#806d75;
  cursor:pointer;
  line-height:1.5;
}

.ratioBtn.active{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:#8f5268;
  font-weight:700;
}

/* 저장 버튼 */

.save{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#302a2d;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.save:hover{
  background:#4a3d42;
}

.save:active{
  transform:scale(.99);
}

/* 미리보기 */

.previewHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}

.stage{
  width:100%;
  border-radius:18px;
  background:
    radial-gradient(
      circle at 50% 20%,
      #fffdfd 0,
      #f9eef2 58%,
      #f5e6eb 100%
    );
  padding:40px;
  min-height:730px;
  display:grid;
  place-items:center;
  overflow:hidden;
}

/*
  미리보기 카드
  실제 저장 캔버스와 동일한 논리 구조
*/

.mac{
  width:min(820px,100%);
  background:#fff;
  border:1px solid #e3dfe1;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 65px rgba(104,61,76,.19);
  position:relative;
  flex:none;
  container-type:inline-size;
}

.mac.ratio-square{
  aspect-ratio:1 / 1;
}

.mac.ratio-portrait{
  aspect-ratio:4 / 5;
}

.macbar{
  height:44px;
  background:rgba(250,249,250,.94);
  border-bottom:1px solid #e7e4e5;
  display:flex;
  align-items:center;
  padding:0 15px;
  position:relative;
  z-index:2;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:#999094;
  letter-spacing:.2px;
  max-width:60%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* 카드 내부 */

.card{
  position:relative;
  width:100%;
  height:calc(100% - 44px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* 1:1 */

.ratio-square .card{
  padding:5.5% 8%;
  gap:4%;
}

.ratio-square .photo{
  width:42%;
  aspect-ratio:1 / 1;
  flex:none;
  border-radius:50%;
}

/* 4:5 */

.ratio-portrait .card{
  padding:5% 9%;
  gap:4%;
}

.ratio-portrait .photo{
  width:44%;
  aspect-ratio:4 / 5;
  flex:none;
  border-radius:
    50%
    50%
    18px
    18px;
}

/* 사진 */

.photo{
  overflow:hidden;
  background:#f7e9ee;
  position:relative;
  box-shadow:0 14px 30px rgba(113,70,84,.14);
  flex-shrink:0;
}

.photo:after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(255,255,255,.8);
  border-radius:inherit;
  pointer-events:none;
}

.photo img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  left:0;
  top:0;
  transform-origin:center center;
  will-change:transform;
}

/* 텍스트 */

.content{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  overflow:hidden;
}

.eyebrow{
  font-size:10px;
  letter-spacing:3px;
  color:var(--accent);
  font-weight:800;
  margin-bottom:2.5%;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.name{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(25px,5cqw,42px);
  line-height:1.2;
  letter-spacing:-1px;
  margin:0 0 2.5%;
  max-width:100%;
  word-break:break-word;
}

.desc{
  width:100%;
  font-size:clamp(10px,1.7cqw,14px);
  line-height:1.8;
  color:#746a70;
  white-space:pre-line;
  margin:0;
  word-break:keep-all;
}

.rule{
  width:55px;
  height:2px;
  background:var(--accent);
  margin:4% auto;
  flex:none;
}

.note{
  width:100%;
  font-size:clamp(9px,1.5cqw,12px);
  line-height:1.8;
  color:#91868b;
  white-space:pre-line;
  margin:0;
  word-break:keep-all;
}

/* 작은 화면 */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

  .stage{
    min-height:0;
  }

}

/*
  모바일 세로 화면에서도
  카드가 잘리지 않고 전체가 보이도록
*/

@media(max-width:600px){

  .wrap{
    padding:22px 12px 50px;
  }

  .editor,
  .preview{
    padding:16px;
    border-radius:20px;
  }

  .palette{
    grid-template-columns:repeat(8,1fr);
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

  .stage{
    padding:14px;
    min-height:0;
  }

  .mac{
    width:100%;
    max-width:100%;
    border-radius:14px;
  }

  .macbar{
    height:36px;
    padding:0 10px;
  }

  .dot{
    width:9px;
    height:9px;
  }

  .dots{
    gap:5px;
  }

  .card{
    height:calc(100% - 36px);
  }

  .ratio-square .card{
    padding:6% 8%;
  }

  .ratio-portrait .card{
    padding:5% 8%;
  }

}

/*
  모바일 가로 화면
*/

@media(
  max-width:900px
) and (
  orientation:landscape
){

  .wrap{
    padding:14px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top .mark{
    font-size:20px;
  }

  .top h1{
    font-size:25px;
  }

  .top p{
    margin-top:5px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .preview{
    width:100%;
  }

  .stage{
    padding:14px;
    min-height:0;
  }

  .mac{
    width:min(
      100%,
      calc(100vw - 60px)
    );
  }

}
</style>
</head>

<body>

<div class="wrap">

<header class="top">

<div class="mark">♡</div>

<h1>Pair Archive</h1>

<p>
두 사람의 이야기를 하나의 작은 창에 담아보세요.
</p>

</header>


<div class="layout">


<!-- =========================
     EDITOR
========================= -->

<section class="editor">


<!-- 페어 정보 -->

<div class="block">

<h3>
<span>01</span>
페어 정보
</h3>


<div class="field">

<label>
맥북 창 이름
</label>

<input
id="windowTitle"
type="text"
value="Pair Archive"
>

</div>


<div class="field">

<label>
페어 이름
</label>

<input
id="name"
type="text"
value="祁煜 × 我"
>

</div>


<div class="field">

<label>
소개
</label>

<textarea
id="desc"
>심해보다 깊은 마음으로
영원히 함께할 우리의 이야기</textarea>

</div>

</div>


<!-- 사진 -->

<div class="block">

<h3>
<span>02</span>
사진
</h3>


<label class="upload">

＋ 사진 선택

<input
id="file"
type="file"
accept="image/*"
>

</label>


<div class="crop">

<img
id="cropImg"
hidden
>

<span
id="hint"
class="hint"
>
사진을 선택한 뒤<br>
드래그해서 위치를 조절해보세요
</span>

<span class="frame"></span>

</div>


<div class="cropTools">

<button
id="minus"
type="button"
>
−
</button>

<span
id="zoom"
class="zoom"
>
100%
</span>

<button
id="plus"
type="button"
>
＋
</button>

<button
id="reset"
type="button"
>
↺
</button>

</div>

</div>


<!-- 컬러 -->

<div class="block">

<h3>
<span>03</span>
포인트 컬러
</h3>


<div class="palette">

<button class="sw active" data-c="#f39ab5" style="background:#f39ab5"></button>

<button class="sw" data-c="#f6a6c1" style="background:#f6a6c1"></button>

<button class="sw" data-c="#f6b7a9" style="background:#f6b7a9"></button>

<button class="sw" data-c="#f7cf8e" style="background:#f7cf8e"></button>

<button class="sw" data-c="#b9d99f" style="background:#b9d99f"></button>

<button class="sw" data-c="#9fd9d0" style="background:#9fd9d0"></button>

<button class="sw" data-c="#9fc8ee" style="background:#9fc8ee"></button>

<button class="sw" data-c="#c5b2e8" style="background:#c5b2e8"></button>

<button class="sw" data-c="#e8a9d4" style="background:#e8a9d4"></button>

<button class="sw" data-c="#f3b8d7" style="background:#f3b8d7"></button>

<button class="sw" data-c="#f1d29d" style="background:#f1d29d"></button>

<button class="sw" data-c="#b8dfc4" style="background:#b8dfc4"></button>

<button class="sw" data-c="#a9dce8" style="background:#a9dce8"></button>

<button class="sw" data-c="#b3c9ee" style="background:#b3c9ee"></button>

<button class="sw" data-c="#d4b9ee" style="background:#d4b9ee"></button>

<button class="sw" data-c="#f2a8a8" style="background:#f2a8a8"></button>

</div>

</div>


<!-- 이야기 -->

<div class="block">

<h3>
<span>04</span>
이야기
</h3>


<div class="field">

<label>
섹션 제목
</label>

<input
id="eyebrow"
type="text"
value="OUR STORY"
>

</div>


<div class="field">

<label>
페어에 대한 이야기
</label>

<textarea
id="note"
>서로의 세계가 되어준 우리
같은 시간, 다른 공간에서도
우리는 언제나 서로를 향해 빛날 거야.</textarea>

</div>

</div>


<!-- 비율 -->

<div class="block">

<h3>
<span>05</span>
결과물 비율
</h3>


<div class="ratioGroup">

<button
class="ratioBtn"
data-ratio="1:1"
type="button"
>
1 : 1<br>
<small>정사각형</small>
</button>


<button
class="ratioBtn active"
data-ratio="4:5"
type="button"
>
4 : 5<br>
<small>인스타그램</small>
</button>

</div>

</div>


<!-- 저장 -->

<button
id="save"
class="save"
type="button"
>
이미지로 저장
</button>


</section>


<!-- =========================
     PREVIEW
========================= -->

<section class="preview">


<div class="previewHead">

<h3>
Preview
</h3>

<small>
Pair Archive · Mac Window Edition
</small>

</div>


<div class="stage">


<div
id="card"
class="mac ratio-portrait"
>


<!-- 맥북 상단 -->

<div class="macbar">

<div class="dots">

<i class="dot r"></i>

<i class="dot y"></i>

<i class="dot g"></i>

</div>


<span
id="outTitle"
class="title"
>
Pair Archive
</span>

</div>


<!-- 카드 -->

<div class="card">


<!-- 사진 -->

<div class="photo">

<img
id="outImg"
hidden
>

</div>


<!-- 텍스트 -->

<div class="content">


<div
id="outEye"
class="eyebrow"
>
OUR STORY
</div>


<h2
id="outName"
class="name"
>
祁煜 × 我
</h2>


<p
id="outDesc"
class="desc"
>
심해보다 깊은 마음으로
영원히 함께할 우리의 이야기
</p>


<div class="rule"></div>


<p
id="outNote"
class="note"
>
서로의 세계가 되어준 우리
같은 시간, 다른 공간에서도
우리는 언제나 서로를 향해 빛날 거야.
</p>


</div>


</div>


</div>


</div>


</section>


</div>

</div>


<script>

(() => {

const $ =
id =>
document.getElementById(id);


/* 상태 */

const state = {

src:null,

scale:1,

x:0,

y:0,

color:'#f39ab5',

ratio:'4:5'

};


/* DOM */

const windowTitle =
$('windowTitle');

const name =
$('name');

const desc =
$('desc');

const eyebrow =
$('eyebrow');

const note =
$('note');

const file =
$('file');

const crop =
document.querySelector('.crop');

const cropImg =
$('cropImg');

const hint =
$('hint');

const outImg =
$('outImg');

const outTitle =
$('outTitle');

const outName =
$('outName');

const outDesc =
$('outDesc');

const outEye =
$('outEye');

const outNote =
$('outNote');

const zoom =
$('zoom');

const card =
$('card');

const save =
$('save');


/*
  사진 표시 크기 계산

  편집창의 사진 위치와
  미리보기 사진 위치를
  같은 비율로 계산하기 위한 함수
*/

function getImageTransform(){

  return {

    x:
      state.x,

    y:
      state.y,

    scale:
      state.scale

  };

}


/* 편집창 사진 */

function renderCrop(){

  if(!state.src){
    return;
  }


  cropImg.style.transform =
    `translate(
      calc(-50% + ${state.x}px),
      calc(-50% + ${state.y}px)
    )
    scale(${state.scale})`;


  zoom.textContent =
    Math.round(
      state.scale * 100
    ) +
    '%';

}


/*
  미리보기 사진

  편집창에서 이동한 거리와
  확대 비율을 동일하게 적용
*/

function renderPreview(){

  if(!state.src){
    return;
  }


  const transform =
    getImageTransform();


  outImg.style.transform =
    `translate(
      ${transform.x * 0.55}px,
      ${transform.y * 0.55}px
    )
    scale(${transform.scale})`;

}


/* 전체 렌더링 */

function render(){

  renderCrop();

  renderPreview();

}


/* 텍스트 동기화 */

function sync(){

  outTitle.textContent =
    windowTitle.value ||
    'Pair Archive';


  outName.textContent =
    name.value ||
    'Pair Name';


  outDesc.textContent =
    desc.value;


  outEye.textContent =
    eyebrow.value ||
    'OUR STORY';


  outNote.textContent =
    note.value;


  document.documentElement.style.setProperty(
    '--accent',
    state.color
  );

}


/* 텍스트 입력 */

[
  windowTitle,
  name,
  desc,
  eyebrow,
  note

].forEach(

input => {

  input.addEventListener(
    'input',
    sync
  );

}

);


/* 사진 선택 */

file.addEventListener(

'change',

event => {

  const selected =
    event.target.files?.[0];


  if(!selected){
    return;
  }


  if(
    !selected.type.startsWith(
      'image/'
    )
  ){

    alert(
      '이미지 파일을 선택해 주세요.'
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
  event => {

    state.src =
      event.target.result;


    state.scale =
      1;


    state.x =
      0;


    state.y =
      0;


    cropImg.src =
      state.src;


    cropImg.hidden =
      false;


    hint.hidden =
      true;


    outImg.src =
      state.src;


    outImg.hidden =
      false;


    render();

  };


  reader.onerror =
  () => {

    alert(
      '사진을 불러오지 못했습니다.'
    );

  };


  reader.readAsDataURL(
    selected
  );

}

);


/* 확대 */

$('plus').addEventListener(

'click',

() => {

  state.scale =
    Math.min(
      3,
      state.scale +
      0.1
    );


  render();

}

);


/* 축소 */

$('minus').addEventListener(

'click',

() => {

  state.scale =
    Math.max(
      0.5,
      state.scale -
      0.1
    );


  render();

}

);


/* 초기화 */

$('reset').addEventListener(

'click',

() => {

  state.scale =
    1;


  state.x =
    0;


  state.y =
    0;


  render();

}

);


/* 마우스 휠 */

crop.addEventListener(

'wheel',

event => {

  if(!state.src){
    return;
  }


  event.preventDefault();


  state.scale =
    Math.max(

      0.5,

      Math.min(

        3,

        state.scale +

        (
          event.deltaY < 0
          ? 0.08
          : -0.08
        )

      )

    );


  render();

},

{
  passive:false
}

);


/* 드래그 */

let dragging =
false;

let lastX =
0;

let lastY =
0;


cropImg.addEventListener(

'pointerdown',

event => {

  if(!state.src){
    return;
  }


  dragging =
    true;


  lastX =
    event.clientX;


  lastY =
    event.clientY;


  cropImg.setPointerCapture(
    event.pointerId
  );

}

);


cropImg.addEventListener(

'pointermove',

event => {

  if(!dragging){
    return;
  }


  state.x +=
    event.clientX -
    lastX;


  state.y +=
    event.clientY -
    lastY;


  lastX =
    event.clientX;


  lastY =
    event.clientY;


  render();

}

);


function stopDragging(){

  dragging =
    false;

}


cropImg.addEventListener(
  'pointerup',
  stopDragging
);

cropImg.addEventListener(
  'pointercancel',
  stopDragging
);


/* 색상 */

document
.querySelectorAll('.sw')
.forEach(

button => {

  button.addEventListener(

    'click',

    () => {

      state.color =
        button.dataset.c;


      document
      .querySelectorAll('.sw')
      .forEach(

        item => {

          item.classList.remove(
            'active'
          );

        }

      );


      button.classList.add(
        'active'
      );


      sync();

    }

  );

}

);


/* 비율 */

document
.querySelectorAll('.ratioBtn')
.forEach(

button => {

  button.addEventListener(

    'click',

    () => {

      state.ratio =
        button.dataset.ratio;


      document
      .querySelectorAll('.ratioBtn')
      .forEach(

        item => {

          item.classList.remove(
            'active'
          );

        }

      );


      button.classList.add(
        'active'
      );


      card.classList.remove(
        'ratio-square',
        'ratio-portrait'
      );


      if(
        state.ratio ===
        '1:1'
      ){

        card.classList.add(
          'ratio-square'
        );

      }else{

        card.classList.add(
          'ratio-portrait'
        );

      }

    }

  );

}

);


/*
  저장용 캔버스

  미리보기와 같은 구조로
  사진과 텍스트를 그린다.
*/

save.addEventListener(

'click',

() => {

  if(!state.src){

    alert(
      '먼저 사진을 선택해 주세요.'
    );

    return;

  }


  const canvas =
    document.createElement(
      'canvas'
    );


  const ctx =
    canvas.getContext(
      '2d'
    );


  if(!ctx){

    alert(
      '이미지를 저장할 수 없습니다.'
    );

    return;

  }


  const W =
    1800;


  const H =
    state.ratio ===
    '1:1'
    ? 1800
    : 2250;


  canvas.width =
    W;


  canvas.height =
    H;


  /* 배경 */

  ctx.fillStyle =
    '#ffffff';


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* 맥북 상단바 */

  const barHeight =
    92;


  ctx.fillStyle =
    '#faf9fa';


  ctx.fillRect(
    0,
    0,
    W,
    barHeight
  );


  /* 버튼 */

  [
    '#ff625a',
    '#ffc04b',
    '#31c85a'

  ].forEach(

    (color,index) => {

      ctx.fillStyle =
        color;


      ctx.beginPath();


      ctx.arc(
        38 +
        index *
        42,
        46,
        13,
        0,
        Math.PI *
        2
      );


      ctx.fill();

    }

  );


  /* 창 제목 */

  ctx.fillStyle =
    '#999094';


  ctx.font =
    '17px sans-serif';


  ctx.textAlign =
    'center';


  ctx.fillText(

    windowTitle.value ||
    'Pair Archive',

    W / 2,

    53

  );


  const image =
    new Image();


  image.onload = () => {

    /*
      저장 이미지의 사진 영역
      미리보기와 동일한 비율
    */

    let photoW;
    let photoH;
    let photoX;
    let photoY;


    if(
      state.ratio ===
      '1:1'
    ){

      photoW =
        700;

      photoH =
        700;

      photoX =
        (
          W -
          photoW
        ) /
        2;

      photoY =
        180;

    }else{

      photoW =
        700;

      photoH =
        875;

      photoX =
        (
          W -
          photoW
        ) /
        2;

      photoY =
        150;

    }


    /* 사진 */

    ctx.save();


    if(
      state.ratio ===
      '1:1'
    ){

      ctx.beginPath();


      ctx.arc(

        W / 2,

        photoY +
        photoH / 2,

        photoW / 2,

        0,

        Math.PI *
        2

      );


      ctx.clip();

    }else{

      roundedRect(

        ctx,

        photoX,

        photoY,

        photoW,

        photoH,

        300

      );


      ctx.clip();

    }


    const fit =
      Math.max(

        photoW /
        image.width,

        photoH /
        image.height

      );


    const iw =
      image.width *
      fit *
      state.scale;


    const ih =
      image.height *
      fit *
      state.scale;


    /*
      저장 이미지와 미리보기의
      위치 이동 비율을 동일하게 적용
    */

    const savedX =
      state.x *
      2;


    const savedY =
      state.y *
      2;


    ctx.drawImage(

      image,

      photoX +
      (
        photoW -
        iw
      ) /
      2 +
      savedX,

      photoY +
      (
        photoH -
        ih
      ) /
      2 +
      savedY,

      iw,

      ih

    );


    ctx.restore();


    /*
      텍스트
    */

    let textY;


    if(
      state.ratio ===
      '1:1'
    ){

      textY =
        1030;

    }else{

      textY =
        1180;

    }


    /* 섹션 제목 */

    ctx.fillStyle =
      state.color;


    ctx.font =
      'bold 22px sans-serif';


    ctx.textAlign =
      'center';


    ctx.fillText(

      (
        eyebrow.value ||
        'OUR STORY'
      ).toUpperCase(),

      W / 2,

      textY

    );


    textY +=
      80;


    /* 페어 이름 */

    ctx.fillStyle =
      '#302a2d';


    ctx.font =
      '500 62px Georgia, serif';


    ctx.fillText(

      name.value ||
      'Pair Name',

      W / 2,

      textY

    );


    textY +=
      75;


    /* 소개 */

    textY =
      drawLines(

        ctx,

        desc.value,

        W / 2,

        textY,

        38,

        '23px sans-serif',

        '#746a70',

        'center'

      );


    /* 라인 */

    ctx.fillStyle =
      state.color;


    ctx.fillRect(

      W / 2 -
      27,

      textY +
      28,

      54,

      2

    );


    /* 이야기 */

    drawLines(

      ctx,

      note.value,

      W / 2,

      textY +
      90,

      34,

      '20px sans-serif',

      '#91868b',

      'center'

    );


    /*
      PNG 생성
    */

    canvas.toBlob(

      blob => {

        if(!blob){

          alert(
            '이미지를 만드는 데 실패했습니다. 다시 시도해 주세요.'
          );

          return;

        }


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            'a'
          );


        link.href =
          url;


        link.download =

          state.ratio ===
          '1:1'

          ? 'pair-archive-1x1.png'

          : 'pair-archive-4x5.png';


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        setTimeout(

          () => {

            URL.revokeObjectURL(
              url
            );

          },

          1000

        );

      },

      'image/png'

    );

  };


  image.onerror =
  () => {

    alert(
      '사진을 불러오지 못했습니다. 다시 사진을 선택해 주세요.'
    );

  };


  image.src =
    state.src;

});


/* 초기화 */

sync();

})();

</script>

</body>
</html>
