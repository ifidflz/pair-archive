<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pair Archive — 페어 카드 스튜디오</title>

<style>

:root{
  --accent:#f39ab5;
  --ink:#302a2d;
  --muted:#8f8187;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans KR",
  "Apple SD Gothic Neo",
  sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

.wrap{
  width:100%;
  max-width:1320px;
  margin:auto;
  padding:38px 24px 70px;
}

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
}

.top h1{
  font-family:Georgia,serif;
  font-weight:500;
  font-size:34px;
  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}

.layout{
  display:grid;
  grid-template-columns:370px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.editor,
.preview{
  background:#fffdfb;
  border:1px solid #f0dfe4;
  border-radius:24px;
  box-shadow:0 18px 45px rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}

.block{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid #eee2e6;
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;
  margin:0 0 16px;
}

.block h3 span{
  color:var(--accent);
  font-family:Georgia,serif;
  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:11px;
  color:#8f8187;
  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:12px;
  padding:11px 12px;
  color:var(--ink);
  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;
  box-shadow:0 0 0 4px #fdebf1;
}

textarea{
  min-height:100px;
  resize:vertical;
  line-height:1.7;
}

.upload{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px dashed #e5b7c5;
  background:#fff8fa;
  border-radius:12px;
  color:#9a6576;
  cursor:pointer;
  font-size:13px;
}

.upload input{
  display:none;
}


/* 사진 조절창 */

.crop{
  position:relative;
  width:100%;
  aspect-ratio:1;
  margin-top:14px;
  border-radius:50%;
  overflow:hidden;
  background:#f8edf0;
  touch-action:none;
  box-shadow:
  inset 0 0 0 2px rgba(255,255,255,.9),
  0 12px 28px rgba(113,70,84,.12);
}

.crop img{
  position:absolute;
  left:50%;
  top:50%;
  max-width:none;
  transform-origin:center center;
  cursor:grab;
  user-select:none;
}

.crop img:active{
  cursor:grabbing;
}

.hint{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:#b29ba2;
  font-size:12px;
  line-height:1.7;
  pointer-events:none;
}

.cropTools{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.cropTools button{
  width:36px;
  height:32px;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:9px;
  cursor:pointer;
}

.zoom{
  min-width:48px;
  text-align:center;
  font-size:11px;
  color:#8f8187;
}


/* 컬러 */

.palette{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.sw{
  width:28px;
  height:28px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #eadde1;
  cursor:pointer;
  padding:0;
}

.sw.active{
  box-shadow:0 0 0 2px #4e3a42;
}


/* 저장 */

.save{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#302a2d;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.save:hover{
  background:#4a3d42;
}


/* 미리보기 */

.previewHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}

.stage{
  width:100%;
  padding:30px;
  border-radius:18px;
  background:
  radial-gradient(
    circle at 50% 20%,
    #fffdfd,
    #f9eef2 60%,
    #f5e6eb
  );
  display:flex;
  justify-content:center;
  overflow:hidden;
}


/*
  핵심

  미리보기 자체가
  실제 PNG와 동일한 4:5 비율

  저장용 PNG도
  이 비율을 그대로 사용
*/

.mac{
  position:relative;
  width:min(100%,720px);
  aspect-ratio:4 / 5;
  background:#fff;
  border:1px solid #e3dfe1;
  border-radius:20px;
  overflow:hidden;
  box-shadow:
  0 30px 65px rgba(104,61,76,.19);
}

.macbar{
  height:5%;
  min-height:36px;
  background:#faf9fa;
  border-bottom:1px solid #e7e4e5;
  display:flex;
  align-items:center;
  padding:0 3%;
  position:relative;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  max-width:60%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  color:#999094;
}


/*
  실제 카드 영역

  모든 요소를
  percentage 기반으로 배치해서

  미리보기와 PNG가
  같은 구조를 갖게 함
*/

.card{
  position:absolute;
  left:0;
  right:0;
  top:5%;
  bottom:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
  4% 8% 5%;

  overflow:hidden;
}


/*
  사진

  가로폭의 80%
*/

.photo{
  position:relative;
  width:80%;
  aspect-ratio:1;
  flex:none;
  border-radius:50%;
  overflow:hidden;
  background:#f7e9ee;

  box-shadow:
  0 16px 35px rgba(113,70,84,.16);

  margin-bottom:4%;
}

.photo::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  pointer-events:none;
}

.photo img{
  position:absolute;
  left:50%;
  top:50%;
  max-width:none;
  transform-origin:center center;
}


/* 글 */

.content{
  width:100%;
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  min-height:0;
  overflow:hidden;
}

.eyebrow{
  color:var(--accent);
  font-size:10px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:2%;
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.name{
  font-family:Georgia,serif;
  font-weight:500;
  font-size:clamp(25px,5vw,42px);
  line-height:1.2;
  letter-spacing:-1px;

  margin:
  0 0 2%;

  max-width:100%;
  word-break:break-word;
}

.desc{
  width:100%;
  font-size:clamp(10px,1.5vw,14px);
  line-height:1.75;
  color:#746a70;

  white-space:pre-line;
  word-break:keep-all;

  margin:0;
}

.rule{
  width:55px;
  height:2px;
  background:var(--accent);
  margin:4% 0;
  flex:none;
}

.note{
  width:100%;
  font-size:clamp(9px,1.3vw,12px);
  line-height:1.8;
  color:#91868b;

  white-space:pre-line;
  word-break:keep-all;

  margin:0;
}


/* 모바일 */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .wrap{
    padding:22px 12px 50px;
  }

  .editor,
  .preview{
    padding:16px;
    border-radius:20px;
  }

  .stage{
    padding:12px;
  }

  .mac{
    width:100%;
  }

  .palette{
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

}

@media(
  max-width:900px
) and (
  orientation:landscape
){

  .wrap{
    padding:12px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top h1{
    font-size:25px;
  }

  .stage{
    padding:12px;
  }

  .mac{
    width:min(
      100%,
      calc(100vw - 80px)
    );
  }

}

</style>
</head>


<body>


<div class="wrap">


<header class="top">

<div class="mark">♡</div>

<p>
두 사람의 이야기를 하나의 작은 창에 담아보세요.
</p>

</header>



<div class="layout">


<section class="editor">


<div class="block">

<h3>
<span>01</span>
페어 정보
</h3>


<div class="field">

<label>
맥북 창 이름
</label>

<input
id="windowTitle"

</div>


<div class="field">

페어 이름

id="name"
type="text"

hidden

<button class="sw" data-c="#f6a6c1" style="background:#f6a6c1"></button>

<button class="sw" data-c="#f6b7a9" style="background:#f6b7a9"></button>

<button class="sw" data-c="#f7cf8e" style="background:#f7cf8e"></button>

<button class="sw" data-c="#b9d99f" style="background:#b9d99f"></button>

<button class="sw" data-c="#9fd9d0" style="background:#9fd9d0"></button>

<button class="sw" data-c="#9fc8ee" style="background:#9fc8ee"></button>

<button class="sw" data-c="#c5b2e8" style="background:#c5b2e8"></button>

<button class="sw" data-c="#e8a9d4" style="background:#e8a9d4"></button>

>

>

hidden
>

>
서로의 세계가 되어준 우리

<script>

(() => {


/* =========================
   상태
========================= */

const state = {

  src:null,

  x:0,

  y:0,

  scale:1,

  color:'#f39ab5'

};



/* =========================
   DOM
========================= */

const $ =
id =>
document.getElementById(id);


const windowTitle =
$('windowTitle');

const name =
$('name');

const desc =
$('desc');

const eyebrow =
$('eyebrow');

const note =
$('note');

const file =
$('file');

const crop =
$('crop');

const cropImg =
$('cropImg');

const hint =
$('hint');

const photo =
$('photo');

const outImg =
$('outImg');

const outTitle =
$('outTitle');

const outName =
$('outName');

const outDesc =
$('outDesc');

const outEye =
$('outEye');

const outNote =
$('outNote');

const zoom =
$('zoom');

const save =
$('save');



/* =========================
   텍스트 동기화
========================= */

function syncText(){


  outTitle.textContent =
    windowTitle.value ||
    'Pair Archive';


  outName.textContent =
    name.value ||
    'Pair Name';


  outDesc.textContent =
    desc.value;


  outEye.textContent =
    eyebrow.value ||
    'OUR STORY';


  outNote.textContent =
    note.value;


  document.documentElement
  .style
  .setProperty(
    '--accent',
    state.color
  );


}



/* =========================
   이미지 크기 계산
========================= */

function getImageSize(

  boxSize,

  naturalWidth,

  naturalHeight,

  scale

){


  const base =

    Math.max(

      boxSize /
      naturalWidth,

      boxSize /
      naturalHeight

    );


  return {

    width:

      naturalWidth *
      base *
      scale,

    height:

      naturalHeight *
      base *
      scale

  };

}



/* =========================
   사진 렌더링

   미리보기는 조절창과
   같은 이미지 좌표를 사용
========================= */

function renderPhoto(){


  if(!state.src){

    return;

  }


  if(
    !cropImg.naturalWidth
  ){

    return;

  }


  /*
    조절창
  */

  const cropSize =
    crop.clientWidth;


  const cropImage =

    getImageSize(

      cropSize,

      cropImg.naturalWidth,

      cropImg.naturalHeight,

      state.scale

    );


  cropImg.style.width =
    cropImage.width +
    'px';


  cropImg.style.height =
    cropImage.height +
    'px';


  cropImg.style.transform =

    `translate(
      calc(-50% + ${state.x}px),
      calc(-50% + ${state.y}px)
    )`;



  /*
    미리보기
  */

  const previewSize =
    photo.clientWidth;


  const previewImage =

    getImageSize(

      previewSize,

      cropImg.naturalWidth,

      cropImg.naturalHeight,

      state.scale

    );


  const ratio =

    previewSize /
    cropSize;


  outImg.style.width =
    previewImage.width +
    'px';


  outImg.style.height =
    previewImage.height +
    'px';


  outImg.style.transform =

    `translate(
      calc(-50% + ${state.x * ratio}px),
      calc(-50% + ${state.y * ratio}px)
    )`;



  zoom.textContent =

    Math.round(
      state.scale *
      100
    ) +

    '%';


}



/* =========================
   파일
========================= */

file.addEventListener(

  'change',

  event => {


    const f =
      event.target.files?.[0];


    if(!f){
      return;
    }


    if(
      !f.type.startsWith(
        'image/'
      )
    ){

      alert(
        '이미지 파일을 선택해 주세요.'
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =

    event => {


      state.src =
        event.target.result;


      state.x =
        0;


      state.y =
        0;


      state.scale =
        1;


      cropImg.onload = () => {


        outImg.src =
          state.src;


        cropImg.hidden =
          false;


        outImg.hidden =
          false;


        hint.hidden =
          true;


        requestAnimationFrame(

          renderPhoto

        );


      };


      cropImg.src =
        state.src;


    };


    reader.readAsDataURL(f);


  }

);



/* =========================
   확대/축소
========================= */

$('plus').onclick =

() => {


  if(!state.src){
    return;
  }


  state.scale =

    Math.min(

      3,

      state.scale +
      .1

    );


  renderPhoto();


};



$('minus').onclick =

() => {


  if(!state.src){
    return;
  }


  state.scale =

    Math.max(

      .5,

      state.scale -
      .1

    );


  renderPhoto();


};



$('reset').onclick =

() => {


  state.x =
    0;


  state.y =
    0;


  state.scale =
    1;


  renderPhoto();


};



/* =========================
   마우스 휠 확대
========================= */

crop.addEventListener(

  'wheel',

  event => {


    if(!state.src){
      return;
    }


    event.preventDefault();


    state.scale =

      Math.max(

        .5,

        Math.min(

          3,

          state.scale +

          (
            event.deltaY < 0
            ? .08
            : -.08
          )

        )

      );


    renderPhoto();


  },

  {
    passive:false
  }

);



/* =========================
   드래그
========================= */

let dragging =
false;

let lastX =
0;

let lastY =
0;


cropImg.addEventListener(

  'pointerdown',

  event => {


    if(!state.src){
      return;
    }


    dragging =
      true;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    cropImg.setPointerCapture(

      event.pointerId

    );


  }

);


cropImg.addEventListener(

  'pointermove',

  event => {


    if(!dragging){
      return;
    }


    state.x +=

      event.clientX -
      lastX;


    state.y +=

      event.clientY -
      lastY;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    renderPhoto();


  }

);


function stopDrag(){

  dragging =
    false;

}


cropImg.addEventListener(
  'pointerup',
  stopDrag
);

cropImg.addEventListener(
  'pointercancel',
  stopDrag
);



/* =========================
   컬러
========================= */

document
.querySelectorAll('.sw')
.forEach(

  button => {


    button.onclick =

    () => {


      state.color =
        button.dataset.c;


      document
      .querySelectorAll('.sw')
      .forEach(

        x =>
        x.classList.remove(
          'active'
        )

      );


      button.classList.add(
        'active'
      );


      syncText();


    };


  }

);



/* =========================
   텍스트
========================= */

[
  windowTitle,
  name,
  desc,
  eyebrow,
  note

].forEach(

  element => {

    element.addEventListener(
      'input',
      syncText
    );

  }

);



/* =========================
   화면 크기 변경
========================= */

window.addEventListener(

  'resize',

  () => {


    if(state.src){

      requestAnimationFrame(

        renderPhoto

      );

    }


  }

);



/* =========================
   PNG 저장

   중요:
   미리보기와 동일한
   4:5 비율과 동일한
   상대좌표 시스템 사용
========================= */

save.onclick =

async () => {


  if(!state.src){

    alert(
      '먼저 사진을 선택해 주세요.'
    );

    return;

  }


  const W =
    1800;


  const H =
    2250;


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    W;


  canvas.height =
    H;


  const ctx =
    canvas.getContext(
      '2d'
    );


  if(!ctx){

    alert(
      '이미지를 저장할 수 없습니다.'
    );

    return;

  }


  /*
    미리보기의 실제 구조를
    1800×2250에 그대로 대응

    macbar = 5%
  */

  const barH =
    H *
    .05;


  /*
    배경
  */

  ctx.fillStyle =
    '#ffffff';


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    맥북 바
  */

  ctx.fillStyle =
    '#faf9fa';


  ctx.fillRect(
    0,
    0,
    W,
    barH
  );


  /*
    버튼
  */

  [
    '#ff625a',
    '#ffc04b',
    '#31c85a'
  ]
  .forEach(

    (color,index) => {


      ctx.fillStyle =
        color;


      ctx.beginPath();


      ctx.arc(

        W *
        .03 +

        index *
        42,

        barH /
        2,

        13,

        0,

        Math.PI *
        2

      );


      ctx.fill();


    }

  );


  /*
    창 이름
  */

  ctx.fillStyle =
    '#999094';


  ctx.font =
    '17px sans-serif';


  ctx.textAlign =
    'center';


  ctx.fillText(

    windowTitle.value ||
    'Pair Archive',

    W /
    2,

    barH *
    .6

  );



  /*
    카드 내부

    미리보기와 동일한
    4% / 8% 패딩
  */

  const cardTop =
    barH;


  const cardHeight =
    H -
    barH;


  const horizontalPadding =
    W *
    .08;


  const innerWidth =

    W -
    horizontalPadding *
    2;


  /*
    사진 80%
  */

  const photoSize =
    innerWidth *
    .80;


  const photoX =

    (
      W -
      photoSize
    ) /
    2;


  const cardPaddingTop =

    cardHeight *
    .04;


  const photoY =

    cardTop +
    cardPaddingTop;


  /*
    이미지 로드
  */

  const image =
    new Image();


  image.onload =

  () => {


    /*
      조절창의 좌표를
      저장 이미지 좌표로 변환

      사진 조절창 크기와
      저장 사진 크기의 비율 사용
    */

    const cropSize =
      crop.clientWidth;


    const ratio =

      photoSize /
      cropSize;


    /*
      실제 사진 크기

      미리보기와 같은
      cover 계산
    */

    const base =

      Math.max(

        photoSize /
        image.naturalWidth,

        photoSize /
        image.naturalHeight

      );


    const drawWidth =

      image.naturalWidth *
      base *
      state.scale;


    const drawHeight =

      image.naturalHeight *
      base *
      state.scale;


    const moveX =

      state.x *
      ratio;


    const moveY =

      state.y *
      ratio;



    /*
      원형 마스크
    */

    ctx.save();


    ctx.beginPath();


    ctx.arc(

      W /
      2,

      photoY +
      photoSize /
      2,

      photoSize /
      2,

      0,

      Math.PI *
      2

    );


    ctx.clip();


    /*
      사진

      미리보기와 동일한
      중앙 정렬 + 이동
    */

    ctx.drawImage(

      image,

      photoX +

      (
        photoSize -
        drawWidth
      ) /
      2 +

      moveX,

      photoY +

      (
        photoSize -
        drawHeight
      ) /
      2 +

      moveY,

      drawWidth,

      drawHeight

    );


    ctx.restore();



    /*
      사진 아래 텍스트 위치

      미리보기와 같은
      percentage 구조
    */

    const photoMargin =

      cardHeight *
      .04;


    let y =

      photoY +
      photoSize +
      photoMargin;



    /*
      컨텐츠 영역 중심
    */

    const centerX =
      W /
      2;



    /*
      섹션 제목
    */

    ctx.fillStyle =
      state.color;


    ctx.font =
      'bold 22px sans-serif';


    ctx.textAlign =
      'center';


    ctx.fillText(

      (
        eyebrow.value ||
        'OUR STORY'
      ).toUpperCase(),

      centerX,

      y +
      25

    );


    y +=
      85;



    /*
      이름
    */

    ctx.fillStyle =
      '#302a2d';


    ctx.font =
      '500 62px Georgia';


    ctx.fillText(

      name.value ||
      'Pair Name',

      centerX,

      y

    );


    y +=
      80;



    /*
      소개
    */

    ctx.font =
      '23px sans-serif';


    ctx.fillStyle =
      '#746a70';


    const descLines =

      String(
        desc.value ||
        ''
      )
      .split('\n');


    descLines.forEach(

      (line,index) => {


        ctx.fillText(

          line,

          centerX,

          y +

          index *
          38

        );


      }

    );


    y +=

      descLines.length *
      38;


    /*
      포인트 라인
    */

    y +=
      24;


    ctx.fillStyle =
      state.color;


    ctx.fillRect(

      centerX -
      27,

      y,

      54,

      2

    );


    y +=
      70;



    /*
      이야기

      미리보기와 동일한
      줄 단위 구조
    */

    ctx.font =
      '20px sans-serif';


    ctx.fillStyle =
      '#91868b';


    const noteLines =

      String(
        note.value ||
        ''
      )
      .split('\n');


    noteLines.forEach(

      (line,index) => {


        ctx.fillText(

          line,

          centerX,

          y +

          index *
          34

        );


      }

    );



    /*
      PNG 생성
    */

    canvas.toBlob(

      blob => {


        if(!blob){

          alert(
            '이미지를 저장하지 못했습니다.'
          );

          return;

        }


        const url =

          URL.createObjectURL(
            blob
          );


        const a =

          document.createElement(
            'a'
          );


        a.href =
          url;


        a.download =
          'pair-archive.png';


        document.body.appendChild(
          a
        );


        a.click();


        a.remove();


        setTimeout(

          () => {

            URL.revokeObjectURL(
              url
            );

          },

          1000

        );


      },

      'image/png'

    );


  };


  image.onerror =

  () => {

    alert(
      '사진을 저장하는 중 오류가 발생했습니다.'
    );

  };


  image.src =
    state.src;


};



/* =========================
   초기화
========================= */

syncText();


})();

</script>

</body>
</html>
