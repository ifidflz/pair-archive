<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pair Archive — 페어 카드 스튜디오</title>

<!-- 미리보기 화면을 그대로 PNG로 캡처하기 위한 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{
  --accent:#f39ab5;
  --ink:#302a2d;
  --muted:#8f8187;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#fff7f8;
  color:var(--ink);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans KR",
  "Apple SD Gothic Neo",
  sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

.wrap{
  width:100%;
  max-width:1320px;
  margin:auto;
  padding:38px 24px 70px;
}

.top{
  text-align:center;
  margin-bottom:30px;
}

.top .mark{
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--accent);
  margin-bottom:6px;
}

.top h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:34px;
  letter-spacing:-.5px;
  margin:0;
}

.top p{
  color:#9c8e94;
  margin:9px 0 0;
  font-size:13px;
}

.layout{
  display:grid;
  grid-template-columns:370px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.editor,
.preview{
  background:#fffdfb;
  border:1px solid #f0dfe4;
  border-radius:24px;
  box-shadow:0 18px 45px rgba(157,83,105,.08);
}

.editor{
  padding:24px;
}

.preview{
  padding:24px;
  min-width:0;
}

.block{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid #eee2e6;
}

.block:last-of-type{
  border-bottom:0;
  margin-bottom:0;
}

.block h3{
  font-size:14px;
  margin:0 0 16px;
}

.block h3 span{
  color:var(--accent);
  font-family:Georgia,serif;
  font-size:16px;
  margin-right:5px;
}

.field{
  margin-bottom:13px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:11px;
  color:#8f8187;
  margin-bottom:6px;
}

input[type=text],
textarea{
  width:100%;
  border:1px solid #eadde1;
  background:#fff;
  border-radius:12px;
  padding:11px 12px;
  color:var(--ink);
  outline:none;
}

input[type=text]:focus,
textarea:focus{
  border-color:#ef9eb7;
  box-shadow:0 0 0 4px #fdebf1;
}

textarea{
  min-height:100px;
  resize:vertical;
  line-height:1.7;
}


/* 사진 업로드 */

.upload{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px dashed #e5b7c5;
  background:#fff8fa;
  border-radius:12px;
  color:#9a6576;
  cursor:pointer;
  font-size:13px;
}

.upload:hover{
  background:#fff1f5;
}

.upload input{
  display:none;
}


/* 사진 조절창 */

.crop{
  position:relative;
  width:100%;
  aspect-ratio:1;
  margin-top:14px;
  border-radius:50%;
  overflow:hidden;
  background:#f8edf0;
  touch-action:none;

  box-shadow:
  inset 0 0 0 2px rgba(255,255,255,.9),
  0 12px 28px rgba(113,70,84,.12);
}

.crop img{
  position:absolute;
  left:50%;
  top:50%;
  max-width:none;
  transform-origin:center center;
  cursor:grab;
  user-select:none;
}

.crop img:active{
  cursor:grabbing;
}

.hint{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:#b29ba2;
  font-size:12px;
  line-height:1.7;
  pointer-events:none;
}

.cropTools{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.cropTools button{
  width:36px;
  height:32px;
  border:1px solid #eadde1;
  background:white;
  border-radius:9px;
  cursor:pointer;
  color:#735966;
}

.zoom{
  font-size:11px;
  color:#8f8187;
  min-width:48px;
  text-align:center;
}


/* 색상 */

.palette{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.sw{
  width:28px;
  height:28px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #eadde1;
  cursor:pointer;
  padding:0;
}

.sw.active{
  box-shadow:0 0 0 2px #4e3a42;
}


/* 저장 버튼 */

.save{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#302a2d;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.save:hover{
  background:#4a3d42;
}

.save:disabled{
  opacity:.6;
  cursor:wait;
}


/* 미리보기 헤더 */

.previewHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:0 2px 14px;
}

.previewHead h3{
  font-size:14px;
  margin:0;
}

.previewHead small{
  color:#ae9ca3;
  font-size:10px;
}


/* 미리보기 배경 */

.stage{
  width:100%;
  border-radius:18px;

  background:
  radial-gradient(
    circle at 50% 20%,
    #fffdfd 0,
    #f9eef2 58%,
    #f5e6eb 100%
  );

  padding:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}


/*
  ====================================
  실제 저장될 결과물
  ====================================

  무조건 4:5

  미리보기 자체가
  저장되는 이미지와 같은 DOM
*/

.mac{
  position:relative;

  width:100%;
  max-width:720px;

  aspect-ratio:4 / 5;

  flex:none;

  background:#fff;

  border:1px solid #e3dfe1;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
  0 30px 65px rgba(104,61,76,.19);
}


/* 맥북 상단 */

.macbar{
  position:relative;

  width:100%;
  height:7%;

  min-height:40px;

  background:#faf9fa;

  border-bottom:1px solid #e7e4e5;

  display:flex;

  align-items:center;

  padding:0 18px;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.r{
  background:#ff625a;
}

.y{
  background:#ffc04b;
}

.g{
  background:#31c85a;
}

.title{
  position:absolute;

  left:50%;

  transform:translateX(-50%);

  max-width:55%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  color:#999094;

  font-size:11px;
}


/* 카드 */

.card{
  position:absolute;

  left:0;
  right:0;

  top:7%;
  bottom:0;

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  padding:
  4% 8% 5%;

  overflow:hidden;
}


/* 사진 */

.photo{
  position:relative;

  width:80%;

  aspect-ratio:1;

  flex:none;

  border-radius:50%;

  overflow:hidden;

  background:#f7e9ee;

  box-shadow:
  0 16px 35px rgba(113,70,84,.16);

  margin-bottom:4%;
}

.photo::after{
  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:
  2px solid
  rgba(255,255,255,.85);

  pointer-events:none;
}

.photo img{
  position:absolute;

  left:50%;
  top:50%;

  max-width:none;

  transform-origin:center center;
}


/* 텍스트 영역 */

.content{
  width:100%;

  min-width:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  overflow:hidden;

  flex:1;
}

.eyebrow{
  width:100%;

  color:var(--accent);

  font-size:10px;

  font-weight:800;

  letter-spacing:3px;

  margin-bottom:2%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.name{
  width:100%;

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-weight:500;

  font-size:clamp(
    25px,
    5vw,
    42px
  );

  line-height:1.2;

  letter-spacing:-1px;

  margin:
  0 0 2%;

  word-break:break-word;
}

.desc{
  width:100%;

  font-size:
  clamp(
    10px,
    1.5vw,
    14px
  );

  line-height:1.75;

  color:#746a70;

  white-space:pre-line;

  word-break:keep-all;

  margin:0;
}

.rule{
  width:55px;

  height:2px;

  background:var(--accent);

  margin:4% 0;

  flex:none;
}

.note{
  width:100%;

  font-size:
  clamp(
    9px,
    1.3vw,
    12px
  );

  line-height:1.8;

  color:#91868b;

  white-space:pre-line;

  word-break:keep-all;

  margin:0;
}


/* =================================
   모바일
================================= */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

}


/*
  세로 모바일

  미리보기 전체가
  화면 안에 들어오게 함
*/

@media(max-width:600px){

  .wrap{
    padding:
    20px 10px 40px;
  }

  .editor,
  .preview{
    padding:16px;
    border-radius:20px;
  }

  .stage{
    padding:10px;
    width:100%;
  }

  .mac{
    width:100%;
    max-width:none;
  }

  .palette{
    gap:7px;
  }

  .sw{
    width:25px;
    height:25px;
  }

}


/*
  모바일 가로 화면

  화면에 잘리지 않도록
  높이 기준으로 축소
*/

@media(
  max-width:950px
) and (
  orientation:landscape
){

  .wrap{
    padding:
    12px 16px 30px;
  }

  .top{
    margin-bottom:18px;
  }

  .top h1{
    font-size:25px;
  }

  .stage{
    padding:10px;
  }

  .mac{
    width:auto;

    height:
    calc(100vh - 180px);

    max-width:none;

    aspect-ratio:
    4 / 5;
  }

}


/*
  캡처할 때
  그림자 제거용 클래스

  PNG 자체에는
  미리보기 그림자까지 포함시키지 않기 위해
  사용 가능
*/

.capture-mode .mac{
  box-shadow:none;
}

</style>
</head>

<script>

(() => {


/* =========================
   상태
========================= */

const state = {

  src:null,

  x:0,

  y:0,

  scale:1,

  color:'#f39ab5'

};



/* =========================
   DOM
========================= */

const $ =
id =>
document.getElementById(id);


const windowTitle =
$('windowTitle');

const name =
$('name');

const desc =
$('desc');

const eyebrow =
$('eyebrow');

const note =
$('note');

const file =
$('file');

const crop =
$('crop');

const cropImg =
$('cropImg');

const hint =
$('hint');

const photo =
$('photo');

const outImg =
$('outImg');

const outTitle =
$('outTitle');

const outName =
$('outName');

const outDesc =
$('outDesc');

const outEye =
$('outEye');

const outNote =
$('outNote');

const zoom =
$('zoom');

const save =
$('save');

const mac =
$('mac');



/* =========================
   텍스트 동기화
========================= */

function syncText(){

  outTitle.textContent =
    windowTitle.value ||
    'Pair Archive';

  outName.textContent =
    name.value ||
    'Pair Name';

  outDesc.textContent =
    desc.value;

  outEye.textContent =
    eyebrow.value ||
    'OUR STORY';

  outNote.textContent =
    note.value;

  document.documentElement
  .style
  .setProperty(
    '--accent',
    state.color
  );

}



/* =========================
   이미지 렌더링

   조절창 → 미리보기
========================= */

function renderPhoto(){

  if(!state.src){
    return;
  }

  if(!cropImg.naturalWidth){
    return;
  }


  const cropSize =
    crop.clientWidth;


  const photoSize =
    photo.clientWidth;


  /*
    조절창에서
    사진이 원을 꽉 채우도록
    cover 계산
  */

  const cropBase =

    Math.max(

      cropSize /
      cropImg.naturalWidth,

      cropSize /
      cropImg.naturalHeight

    );


  const cropWidth =

    cropImg.naturalWidth *
    cropBase *
    state.scale;


  const cropHeight =

    cropImg.naturalHeight *
    cropBase *
    state.scale;


  cropImg.style.width =
    cropWidth + 'px';


  cropImg.style.height =
    cropHeight + 'px';


  cropImg.style.transform =

    `translate(
      calc(-50% + ${state.x}px),
      calc(-50% + ${state.y}px)
    )`;



  /*
    미리보기

    조절창과 동일한
    이미지 위치를 비율로 변환
  */

  const ratio =
    photoSize /
    cropSize;


  const previewBase =

    Math.max(

      photoSize /
      cropImg.naturalWidth,

      photoSize /
      cropImg.naturalHeight

    );


  const previewWidth =

    cropImg.naturalWidth *
    previewBase *
    state.scale;


  const previewHeight =

    cropImg.naturalHeight *
    previewBase *
    state.scale;


  outImg.style.width =
    previewWidth + 'px';


  outImg.style.height =
    previewHeight + 'px';


  outImg.style.transform =

    `translate(
      calc(-50% + ${state.x * ratio}px),
      calc(-50% + ${state.y * ratio}px)
    )`;


  zoom.textContent =

    Math.round(
      state.scale *
      100
    ) + '%';

}



/* =========================
   사진 업로드
========================= */

file.addEventListener(

  'change',

  event => {

    const f =
      event.target.files?.[0];

    if(!f){
      return;
    }

    if(
      !f.type.startsWith('image/')
    ){

      alert(
        '이미지 파일을 선택해 주세요.'
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =

    event => {

      state.src =
        event.target.result;

      state.x =
        0;

      state.y =
        0;

      state.scale =
        1;


      cropImg.onload = () => {

        cropImg.hidden =
          false;

        outImg.src =
          state.src;

        outImg.hidden =
          false;

        hint.hidden =
          true;


        requestAnimationFrame(
          renderPhoto
        );

      };


      cropImg.src =
        state.src;

    };


    reader.readAsDataURL(f);

  }

);



/* =========================
   확대
========================= */

$('plus').onclick = () => {

  if(!state.src){
    return;
  }

  state.scale =

    Math.min(
      3,
      state.scale + .1
    );

  renderPhoto();

};



/* =========================
   축소
========================= */

$('minus').onclick = () => {

  if(!state.src){
    return;
  }

  state.scale =

    Math.max(
      .5,
      state.scale - .1
    );

  renderPhoto();

};



/* =========================
   초기화
========================= */

$('reset').onclick = () => {

  state.x =
    0;

  state.y =
    0;

  state.scale =
    1;

  renderPhoto();

};



/* =========================
   마우스 휠
========================= */

crop.addEventListener(

  'wheel',

  event => {

    if(!state.src){
      return;
    }

    event.preventDefault();


    state.scale =

      Math.max(

        .5,

        Math.min(

          3,

          state.scale +

          (
            event.deltaY < 0
            ? .08
            : -.08
          )

        )

      );


    renderPhoto();

  },

  {
    passive:false
  }

);



/* =========================
   드래그
========================= */

let dragging =
false;

let lastX =
0;

let lastY =
0;


cropImg.addEventListener(

  'pointerdown',

  event => {

    if(!state.src){
      return;
    }

    dragging =
      true;

    lastX =
      event.clientX;

    lastY =
      event.clientY;

    cropImg.setPointerCapture(
      event.pointerId
    );

  }

);


cropImg.addEventListener(

  'pointermove',

  event => {

    if(!dragging){
      return;
    }


    state.x +=

      event.clientX -
      lastX;


    state.y +=

      event.clientY -
      lastY;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    renderPhoto();

  }

);


function stopDrag(){

  dragging =
    false;

}


cropImg.addEventListener(
  'pointerup',
  stopDrag
);

cropImg.addEventListener(
  'pointercancel',
  stopDrag
);



/* =========================
   색상
========================= */

document
.querySelectorAll('.sw')
.forEach(

  button => {

    button.onclick = () => {

      state.color =
        button.dataset.c;


      document
      .querySelectorAll('.sw')
      .forEach(

        x =>
        x.classList.remove(
          'active'
        )

      );


      button.classList.add(
        'active'
      );


      syncText();

    };

  }

);



/* =========================
   텍스트 입력
========================= */

[
  windowTitle,
  name,
  desc,
  eyebrow,
  note

].forEach(

  element => {

    element.addEventListener(
      'input',
      syncText
    );

  }

);



/* =========================
   화면 크기 변경
========================= */

window.addEventListener(

  'resize',

  () => {

    if(state.src){

      requestAnimationFrame(
        renderPhoto
      );

    }

  }

);



/* =========================
   이미지 저장

   핵심:

   Canvas로 다시 그리지 않음.

   #mac DOM 자체를
   html2canvas로 캡처함.

   따라서

   미리보기 =
   저장 결과

   가 됨.
========================= */

save.addEventListener(

  'click',

  async () => {


    if(!state.src){

      alert(
        '먼저 사진을 선택해 주세요.'
      );

      return;

    }


    if(
      typeof html2canvas ===
      'undefined'
    ){

      alert(
        '이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'
      );

      return;

    }


    save.disabled =
      true;

    save.textContent =
      '이미지 생성 중...';


    try{


      /*
        이미지가 실제로
        로드될 때까지 기다림
      */

      if(
        outImg.complete === false
      ){

        await new Promise(

          resolve => {

            outImg.onload =
              resolve;

          }

        );

      }


      /*
        브라우저가
        마지막 CSS 렌더링을
        완료하도록 대기
      */

      await new Promise(

        resolve =>

          requestAnimationFrame(

            () =>

            requestAnimationFrame(
              resolve
            )

          )

      );


      /*
        현재 미리보기 DOM을
        그대로 캡처

        scale:3
        → 저장 PNG 해상도를
        미리보기보다 높게 생성

        width/height 비율은
        정확히 동일
      */

      const canvas =

        await html2canvas(

          mac,

          {

            scale:3,

            useCORS:true,

            allowTaint:false,

            backgroundColor:'#ffffff',

            logging:false,

            imageTimeout:15000

          }

        );


      /*
        PNG 생성
      */

      const blob =

        await new Promise(

          resolve =>

            canvas.toBlob(

              resolve,

              'image/png',

              1

            )

        );


      if(!blob){

        throw new Error(
          'PNG 생성 실패'
        );

      }


      /*
        다운로드
      */

      const url =

        URL.createObjectURL(
          blob
        );


      const link =

        document.createElement(
          'a'
        );


      link.href =
        url;


      link.download =
        'pair-archive.png';


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(

        () => {

          URL.revokeObjectURL(
            url
          );

        },

        1500

      );


    }catch(error){

      console.error(
        error
      );


      alert(
        '이미지를 저장하는 중 문제가 발생했습니다.\n잠시 후 다시 시도해 주세요.'
      );


    }finally{

      save.disabled =
        false;

      save.textContent =
        '이미지로 저장';

    }


  }

);



/* =========================
   초기화
========================= */

syncText();


})();

</script>
